<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RCR Dashboard</title>
<link rel="icon" id="favicon" href="data:,">
<script src="../shared/rcr-drive.js"></script><!-- Google Drive saving for the web app version; unused when opened from the computer -->
<style>
  :root { --bg:#f2f4f8; --card:#fff; --ink:#1b2333; --mut:#6b7486; --line:#e2e6ee; --accent:#1d5fd1; --accent2:#e8f0fe;
          --side:#121a2b; --good:#16a34a; --warn:#d97706; --bad:#dc2626; --r:10px; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 "Segoe UI", system-ui, Arial, sans-serif; color:var(--ink); background:var(--bg); }
  a { color:var(--accent); }
  button, input, select, textarea { font:inherit; color:inherit; }
  #app { display:grid; grid-template-columns:220px 1fr; min-height:100vh; }
  aside { background:var(--side); color:#cfd6e4; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; padding:14px 10px; overflow:auto; }
  .brand { display:flex; align-items:center; gap:10px; padding:2px 8px 16px; color:#fff; font-weight:700; font-size:15px; line-height:1.15; }
  .brand img { width:42px; height:42px; border-radius:8px; background:#fff; object-fit:contain; padding:2px; }
  .brand small { display:block; font-weight:400; color:#8f9ab0; font-size:11px; }
  nav a { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; color:#cfd6e4; text-decoration:none; margin:1px 0; cursor:pointer; user-select:none; }
  nav a:hover { background:#1e2940; }
  nav a.on { background:var(--accent); color:#fff; }
  nav a .ct { margin-left:auto; background:#2b3854; border-radius:10px; padding:0 7px; font-size:11px; }
  nav a .ct.hot { background:var(--bad); color:#fff; }
  nav a.on .ct { background:rgba(255,255,255,.25); }
  nav .sep { height:1px; background:#26314a; margin:10px 6px; }
  .side-foot { margin-top:auto; font-size:11px; color:#8f9ab0; padding:8px; }
  main { min-width:0; }
  .top { position:sticky; top:0; z-index:5; background:rgba(242,244,248,.94); backdrop-filter:blur(6px); display:flex; align-items:center; gap:12px; padding:12px 22px; border-bottom:1px solid var(--line); }
  .top h1 { font-size:19px; margin:0; white-space:nowrap; }
  .search { position:relative; flex:1; max-width:460px; margin-left:auto; }
  .search input { width:100%; padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  #gres { position:absolute; top:40px; left:0; right:0; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.15); max-height:70vh; overflow:auto; z-index:30; }
  #gres .h { font-size:11px; text-transform:uppercase; color:var(--mut); padding:8px 12px 2px; letter-spacing:.04em; }
  #gres .it { padding:7px 12px; cursor:pointer; }
  #gres .it:hover, #gres .it.sel { background:var(--accent2); }
  #gres .it small { color:var(--mut); }
  .sync { font-size:12px; padding:5px 10px; border-radius:20px; background:#fff; border:1px solid var(--line); cursor:pointer; white-space:nowrap; }
  .sync.saved { color:var(--good); } .sync.warn { color:var(--warn); border-color:#f3d39b; background:#fff8eb; } .sync.err { color:var(--bad); border-color:#f5b5b5; background:#fff1f1; }
  .content { padding:20px 22px 40px; }
  .btn { border:1px solid var(--line); background:#fff; padding:7px 12px; border-radius:8px; cursor:pointer; white-space:nowrap; }
  .btn:hover { border-color:#b8c2d6; }
  a.btn { text-decoration:none; color:inherit; display:inline-block; }
  .btn.pri { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.pri:hover { background:#174fb0; }
  .btn.danger { color:var(--bad); }
  .btn.sm { padding:3px 8px; font-size:12px; border-radius:6px; }
  .btn.on { background:var(--accent2); border-color:var(--accent); color:var(--accent); }
  .btn.ok { background:#16a34a; border-color:#16a34a; color:#fff; } .btn.ok:hover { background:#128a3e; }
  .paygrid { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; } .paygrid .btn { padding:10px 6px; font-weight:600; }
  .row2 { display:grid; grid-template-columns:1fr 2fr; gap:10px; } .row2 label { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--mut); }
  .row2 input { padding:7px 9px; border:1px solid var(--line); border-radius:8px; font:inherit; color:var(--ink, inherit); background:var(--card, #fff); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1; }
  .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .toolbar input[type=search], .toolbar select { padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .toolbar input[type=search] { min-width:240px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#fff; }
  .seg button { border:0; background:none; padding:7px 12px; cursor:pointer; border-right:1px solid var(--line); }
  .seg button:last-child { border-right:0; }
  .seg button.on { background:var(--accent); color:#fff; }
  .grid { display:grid; gap:14px; }
  .kpis { grid-template-columns:repeat(auto-fill, minmax(175px, 1fr)); margin-bottom:14px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:13px 15px; cursor:pointer; transition:box-shadow .15s; }
  .kpi:hover { box-shadow:0 4px 14px rgba(20,30,60,.08); }
  .kpi .l { color:var(--mut); font-size:12px; }
  .kpi .v { font-size:24px; font-weight:700; margin-top:2px; }
  .kpi .s { font-size:12px; color:var(--mut); margin-top:2px; }
  .kpi.alert .v { color:var(--bad); } .kpi.good .v { color:var(--good); } .kpi.warn .v { color:var(--warn); }
  .up { color:var(--good); } .down { color:var(--bad); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; min-width:0; }
  .card h3 { margin:0 0 10px; font-size:14px; display:flex; align-items:center; gap:8px; }
  .card h3 .r { margin-left:auto; font-weight:400; }
  .c2 { grid-template-columns:1.6fr 1fr; } .c3 { grid-template-columns:repeat(3, 1fr); } .c2e { grid-template-columns:1fr 1fr; }
  @media (max-width:1150px) { .c2, .c3, .c2e { grid-template-columns:1fr; } }
  .muted { color:var(--mut); } .small { font-size:12px; }
  .empty { color:var(--mut); padding:14px 4px; text-align:center; }
  table.t { width:100%; border-collapse:collapse; background:#fff; }
  table.t th { text-align:left; font-size:12px; color:var(--mut); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; position:sticky; top:var(--toph, 60px); z-index:2; background:#fff; }
  table.t td { padding:8px 10px; border-bottom:1px solid #eef1f6; vertical-align:top; }
  table.t tr.click { cursor:pointer; }
  table.t .ed { opacity:0; padding:0 5px; }
  table.t tr:hover .ed { opacity:1; }
  table.t tr.click:hover td { background:#f7f9fd; }
  table.t td.num, table.t th.num { text-align:right; white-space:nowrap; }
  .tablewrap { background:#fff; border:1px solid var(--line); border-radius:var(--r); overflow:clip; }   /* clip (not hidden) so the sticky header sticks under the top bar */
  .mbox table.t th { position:static; }
  .badge { display:inline-block; padding:1px 8px; border-radius:20px; font-size:11.5px; font-weight:600; color:#fff; white-space:nowrap; }
  .tag { display:inline-block; padding:0 6px; border-radius:5px; font-size:11px; background:#eef1f6; color:#4b5468; white-space:nowrap; }
  .tag.red { background:#fde8e8; color:var(--bad); } .tag.amber { background:#fff3dc; color:#a35d00; } .tag.green { background:#e3f6e9; color:#13803c; } .tag.blue { background:var(--accent2); color:var(--accent); }
  /* board */
  .board { display:grid; grid-template-columns:repeat(6, minmax(190px, 1fr)); gap:10px; overflow-x:auto; padding-bottom:8px; }
  .col { background:#e8ebf2; border-radius:var(--r); padding:8px; min-height:300px; }
  .col.over { outline:2px dashed var(--accent); }
  .col > header { display:flex; align-items:center; gap:6px; font-weight:600; font-size:13px; padding:2px 4px 8px; }
  .col > header .dot { width:9px; height:9px; border-radius:50%; }
  .col > header .n { margin-left:auto; color:var(--mut); font-weight:400; }
  .tc { background:#fff; border-radius:8px; padding:9px 10px; margin-bottom:8px; border:1px solid var(--line); cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .tc:hover { border-color:#b8c2d6; }
  .tc .no { font-size:11px; color:var(--mut); display:flex; gap:6px; align-items:center; }
  .tc .nm { font-weight:600; margin:2px 0 1px; }
  .tc .dv { font-size:12.5px; }
  .tc .is { font-size:12px; color:var(--mut); margin-top:3px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .tc .ft { display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
  /* charts */
  svg.chart { width:100%; height:auto; display:block; }
  svg.chart text { font-size:11px; fill:#6b7486; }
  svg.chart .bar { fill:var(--accent); } svg.chart .bar.cur { fill:#5b8fe8; }
  svg.chart .bar:hover { fill:#0f3f99; }
  .hb { display:grid; grid-template-columns:150px 1fr 90px; gap:8px; align-items:center; margin:5px 0; font-size:13px; }
  .hb .trk { background:#eef1f6; border-radius:4px; height:12px; overflow:hidden; }
  .hb .trk i { display:block; height:100%; border-radius:4px; }
  .hb b { text-align:right; font-weight:600; white-space:nowrap; }
  .hb span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* lists */
  .li { display:flex; gap:10px; align-items:flex-start; padding:8px 2px; border-bottom:1px solid #eef1f6; }
  .li:last-child { border-bottom:0; }
  .li .ic { width:26px; text-align:center; font-size:16px; }
  .li .tx { flex:1; min-width:0; }
  .li .tx .s { color:var(--mut); font-size:12px; }
  .li .ac { display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
  .li.done .tx { text-decoration:line-through; color:var(--mut); }
  .sec-h { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--mut); margin:18px 0 6px; font-weight:600; }
  /* modal */
  #modal { position:fixed; inset:0; background:rgba(10,15,30,.5); z-index:40; display:flex; align-items:flex-start; justify-content:center; padding:4vh 16px; overflow:auto; }
  #modal[hidden] { display:none; }
  .mbox { background:#fff; border-radius:12px; width:560px; max-width:100%; box-shadow:0 20px 60px rgba(0,0,0,.3); }
  .mbox.wide { width:1020px; }
  .mbox > header { display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--line); }
  .mbox > header h3 { margin:0; font-size:17px; }
  .mbox > header .x { margin-left:auto; border:0; background:none; font-size:24px; line-height:1; cursor:pointer; color:var(--mut); }
  .mbody { padding:16px 18px; }
  .mbox > footer { display:flex; gap:8px; flex-wrap:wrap; padding:12px 18px; border-top:1px solid var(--line); background:#fafbfd; border-radius:0 0 12px 12px; }
  .f { display:grid; gap:10px 14px; grid-template-columns:repeat(2, 1fr); }
  .f.three { grid-template-columns:repeat(3, 1fr); }
  .f .full { grid-column:1/-1; }
  .f label, .fl { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--mut); font-weight:600; }
  .f input:not([type=checkbox]), .f select, .f textarea, .inp { padding:7px 9px; border:1px solid #d5dbe6; border-radius:7px; background:#fff; color:var(--ink); font-weight:400; font-size:14px; width:100%; }
  .f textarea { min-height:62px; resize:vertical; }
  .f input:focus, .f select:focus, .f textarea:focus, .inp:focus { outline:2px solid #b9d0fb; border-color:var(--accent); }
  .chk { display:flex; flex-wrap:wrap; gap:6px 14px; font-weight:400; color:var(--ink); font-size:13px; }
  .chk label { flex-direction:row; align-items:center; gap:5px; font-weight:400; color:var(--ink); font-size:13px; }
  .tk { display:grid; grid-template-columns:1.25fr 1fr; gap:18px; }
  @media (max-width:900px) { .tk { grid-template-columns:1fr; } .f.three { grid-template-columns:1fr 1fr; } }
  .box { border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:12px; }
  .box > .bh { font-weight:700; font-size:13px; margin-bottom:8px; display:flex; align-items:center; gap:8px; }
  .box > .bh .r { margin-left:auto; }
  .ret { background:#f0f6ff; border:1px solid #cfe0fb; border-radius:8px; padding:8px 10px; font-size:12.5px; margin-top:8px; }
  .ret[hidden] { display:none; }
  .note { border-left:3px solid #cfd8e8; padding:2px 0 2px 9px; margin:6px 0; font-size:13px; white-space:pre-wrap; }
  .note small { display:block; color:var(--mut); }
  .pl { display:grid; grid-template-columns:1fr 80px 80px 26px 24px; gap:5px; margin-bottom:5px; align-items:center; }
  .pl input { padding:5px 7px; border:1px solid #d5dbe6; border-radius:6px; width:100%; }
  .pl button { border:0; background:none; color:var(--bad); cursor:pointer; font-size:16px; }
  /* toasts */
  #toasts { position:fixed; right:18px; bottom:18px; z-index:60; display:flex; flex-direction:column; gap:8px; }
  .toast { background:#1b2333; color:#fff; padding:10px 14px; border-radius:9px; box-shadow:0 6px 20px rgba(0,0,0,.25); display:flex; gap:10px; align-items:center; max-width:440px; }
  .toast.err { background:#9b1c1c; }
  .toast button { background:rgba(255,255,255,.15); border:0; color:#fff; padding:4px 9px; border-radius:6px; cursor:pointer; }
  .banner { background:#fff8eb; border:1px solid #f3d39b; color:#7a4a00; padding:10px 14px; border-radius:10px; margin-bottom:14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  details.inv summary { cursor:pointer; }
  kbd { background:#eef1f6; border:1px solid #d5dbe6; border-bottom-width:2px; border-radius:4px; padding:0 5px; font-size:12px; }
  /* tech tools */
  .tools { grid-template-columns:repeat(auto-fill, minmax(380px, 1fr)); align-items:start; grid-auto-flow:row dense; }
  .cmd { display:flex; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid #eef1f6; }
  .cmd:last-child { border-bottom:0; }
  .cmd code { flex:1; min-width:0; font:12px Consolas, "Cascadia Mono", monospace; background:#f3f5f9; padding:4px 7px; border-radius:5px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .tools .wide { grid-column:span 2; }
  @media (max-width:1150px) { .tools .wide { grid-column:auto; } }
  .kb { overflow-x:auto; }
  .cmd .d { width:170px; font-size:12.5px; }
  .cmd .d small { display:block; color:var(--mut); font-size:11px; }
  .kb { outline:none; padding:10px; border:2px dashed var(--line); border-radius:10px; user-select:none; }
  .kb:focus { border-color:var(--accent); }
  .kb .kr { display:flex; gap:4px; margin-bottom:4px; }
  .kb .k { flex:0 0 auto; width:34px; height:30px; border:1px solid #c9d1df; border-radius:5px; font-size:10px; display:flex; align-items:center; justify-content:center; background:#fff; color:#333; }
  .kb .k.hit { background:#bdf0cd; border-color:#16a34a; }
  .kb .k.kd { background:var(--accent); color:#fff; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:16px; padding:2px 9px; font-size:12px; cursor:pointer; user-select:none; }
  .chip.ok { background:#e3f6e9; border-color:#16a34a; color:#13803c; } .chip.bad { background:#fde8e8; border-color:var(--bad); color:var(--bad); } .chip.na { background:#eef1f6; color:#888; text-decoration:line-through; }
  .out { font:13px Consolas, monospace; background:#f3f5f9; border-radius:7px; padding:8px 10px; margin-top:8px; white-space:pre-wrap; }
  #screentest { position:fixed; inset:0; z-index:100; cursor:none; display:flex; align-items:flex-end; justify-content:center; }
  #screentest span { margin-bottom:20px; padding:4px 10px; border-radius:6px; background:rgba(0,0,0,.5); color:#fff; font-size:12px; cursor:default; }
  .tip { background:linear-gradient(90deg, var(--accent2), transparent); border:1px solid var(--line); border-radius:var(--r); padding:9px 14px; margin-bottom:14px; font-size:13px; }
  .side-foot select { background:#1e2940; color:#cfd6e4; border:1px solid #2b3854; border-radius:6px; padding:2px 4px; font-size:11px; }
  /* themes */
  [data-theme] .top { background:var(--bg); }
  [data-theme] table.t, [data-theme] table.t th, [data-theme] .tablewrap, [data-theme] .btn, [data-theme] .seg, [data-theme] .tc, [data-theme] .mbox,
  [data-theme] .sync, [data-theme] .search input, [data-theme] .toolbar input, [data-theme] .toolbar select, [data-theme] .f input:not([type=checkbox]),
  [data-theme] .f select, [data-theme] .f textarea, [data-theme] .inp, [data-theme] #gres, [data-theme] .pl input, [data-theme] .chip, [data-theme] .mbox > footer
    { background:var(--card); color:var(--ink); border-color:var(--line); }
  [data-theme] .btn.pri { background:var(--accent); border-color:var(--accent); color:#fff; }
  [data-theme] .chip.ok { background:#123821; color:#5fe08c; } [data-theme] .chip.bad { background:#3d1515; color:#ff8a8a; }
  [data-theme] table.t td, [data-theme] .li, [data-theme] .cmd { border-color:var(--line); }
  [data-theme] table.t tr.click:hover td, [data-theme] #gres .it:hover, [data-theme] #gres .it.sel { background:var(--accent2); }
  [data-theme] .col { background:#1a2131; }
  [data-theme] .hb .trk, [data-theme] .tag, [data-theme] kbd, [data-theme] .cmd code, [data-theme] .out { background:#243049; color:var(--ink); }
  [data-theme] .ret { background:#16243d; border-color:#2a3f66; }
  [data-theme] .banner { background:#3a2d12; border-color:#6b5320; color:#f6d98b; }
  [data-theme] svg.chart text { fill:var(--mut); }
  [data-theme=dark] { --bg:#0e1320; --card:#161d2c; --ink:#e3e8f2; --mut:#93a0b8; --line:#283246; --accent:#4b8bf5; --accent2:#1b2a47; }
  [data-theme=terminal] { --bg:#050805; --card:#0b120b; --ink:#39ff88; --mut:#25a75a; --line:#173b22; --accent:#39ff88; --accent2:#0f2a17; --side:#020402; }
  [data-theme=terminal] body { font-family:Consolas, "Cascadia Mono", "Courier New", monospace; text-shadow:0 0 4px rgba(57,255,136,.35); }
  [data-theme=terminal] .btn.pri, [data-theme=terminal] nav a.on, [data-theme=terminal] .seg button.on { color:#000; text-shadow:none; }
  [data-theme=terminal] aside, [data-theme=terminal] nav a { color:#39ff88; }
  [data-theme=terminal] .badge { color:#000; text-shadow:none; }
  /* phone pages: date / status chips, agenda cards, ticket cards */
  .dstrip { display:flex; gap:8px; overflow-x:auto; margin:0 -10px 8px; padding:2px 10px 8px; scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .dstrip::-webkit-scrollbar { display:none; }
  .dchip { flex:0 0 auto; width:56px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:14px; padding:7px 0 5px; display:flex; flex-direction:column; align-items:center; gap:1px; cursor:pointer; scroll-snap-align:start; font:inherit; }
  .dchip span { font-size:11px; color:var(--mut); text-transform:uppercase; letter-spacing:.03em; }
  .dchip b { font-size:20px; line-height:1.15; }
  .dchip i { font-style:normal; font-size:8px; color:var(--accent); letter-spacing:1px; height:10px; line-height:10px; }
  .dchip.today { border-color:var(--accent); }
  .dchip.on { background:var(--accent); border-color:var(--accent); color:#fff; } .dchip.on span, .dchip.on i { color:#fff; }
  .chipbtn { flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:18px; padding:7px 13px; font:inherit; font-size:13.5px; cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:6px; }
  .chipbtn b { font-weight:600; color:var(--mut); }
  .chipbtn.on { background:var(--accent); border-color:var(--accent); color:#fff; } .chipbtn.on b { color:rgba(255,255,255,.85); }
  .chipbtn .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .ag { display:grid; grid-template-columns:58px 1fr 34px; gap:8px 10px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .ag .tm { text-align:center; border-right:1px solid var(--line); padding-right:8px; cursor:pointer; align-self:start; }
  .ag .tm b { display:block; font-size:19px; line-height:1.1; } .ag .tm span { font-size:11px; color:var(--mut); font-weight:600; }

function normalize(d) {

function merge(a, b) {          // combine two copies of the data (e.g. office PC + home PC via Google Drive): newest edit of each record wins
  const m = blank(), del = { ...(a.deleted || {}) };
  for (const [k, v] of Object.entries(b.deleted || {})) if (!del[k] || v > del[k]) del[k] = v;
  const cutoff = new Date(Date.now() - 180 * 864e5).toISOString();
  for (const k of Object.keys(del)) if (del[k] < cutoff) delete del[k];
  m.deleted = del;
  for (const c of COLLS) {
    const map = new Map();
    for (const r of [...b[c], ...a[c]]) { const o = map.get(r.id); if (!o || (r.upd || '') >= (o.upd || '')) map.set(r.id, r); }
    m[c] = [...map.values()].filter(r => !(del[r.id] && del[r.id] >= (r.upd || '')));
  }
  m.custNotes = { ...b.custNotes };
  for (const [k, v] of Object.entries(a.custNotes || {})) if (!m.custNotes[k] || (v.upd || '') >= (m.custNotes[k].upd || '')) m.custNotes[k] = v;
  const useA = (a.settingsUpd || '') >= (b.settingsUpd || '');
  m.settings = { ...(useA ? a.settings : b.settings) }; m.settingsUpd = useA ? a.settingsUpd : b.settingsUpd;
  m.settings.nextTicket = Math.max(a.settings.nextTicket || 0, b.settings.nextTicket || 0, ...m.tickets.map(t => (t.no || 0) + 1));
  m.savedAt = (a.savedAt || '') > (b.savedAt || '') ? a.savedAt : b.savedAt;
  return normalize(m);
}

function upsert(coll, rec) { rec.upd = nowISO(); const a = DB[coll], i = a.findIndex(x => x.id === rec.id); if (i < 0) a.push(rec); else a[i] = rec; commit(); }
function removeRec(coll, id) { DB[coll] = DB[coll].filter(x => x.id !== id); DB.deleted[id] = nowISO(); commit(); }
function saveSettings(patch) { Object.assign(DB.settings, patch); DB.settingsUpd = nowISO(); commit(); }

async function getDir(root, path, create) { let d = root; for (const part of String(path || '').split(/[\\/]/).filter(Boolean)) d = await d.getDirectoryHandle(part, { create }); return d; }

const parseJSON = t => JSON.parse(t.replace(/^﻿/, ''));

async function flush() {
  if (!folder || !folderOK) { pending = false; setSync(folder ? 'reconnect' : 'local'); return; }
  if (busy) { clearTimeout(wt); wt = setTimeout(flush, 500); return; }
  busy = true;
  try {
    const d = await getDir(folder, S().dataPath, true);
    const t = await readText(d, DATA_FILE);
    const before = JSON.stringify(DB);
    if (t) DB = merge(DB, normalize(parseJSON(t)));
    persistLocal();
    await writeText(d, DATA_FILE, JSON.stringify(DB));
    pending = false;

}
async function pullFromFolder() {           // read the Drive copy and merge it in (another computer may have changed it)
  if (!folder || !folderOK || busy) return;
  busy = true;
  try {
    const d = await getDir(folder, S().dataPath, true);
    const t = await readText(d, DATA_FILE);
    const before = JSON.stringify(DB);
    let needWrite = !t;
    if (t) { const remote = normalize(parseJSON(t)); DB = merge(DB, remote); needWrite = JSON.stringify(DB) !== JSON.stringify(remote); }
    persistLocal();
    if (needWrite) await writeText(d, DATA_FILE, JSON.stringify(DB));
    await weeklyBackup(d);

async function weeklyBackup(d) {
  const day = today(); if (backupDay === day) return; backupDay = day;
  const b = await d.getDirectoryHandle('Backups', { create: true }); const names = [];
  for await (const [n] of b.entries()) if (/^Dashboard Backup \d{4}-\d\d-\d\d\.json$/.test(n)) names.push(n);
  names.sort(); const last = names[names.length - 1];

// Find the invoice log even if a folder one level too high or too low was picked

async function findLog(root, p) {
  const parts = String(p).split(/[\\/]/).filter(Boolean), tries = [];
  for (let i = 0; i <= parts.length; i++) tries.push(parts.slice(i).join('/'));          // Invoice/2026 Invoices → 2026 Invoices → (picked folder itself)
  tries.push('RCR/' + p, 'Documents/RCR/' + p, 'My Drive/Documents/RCR/' + p);
  for (const t of tries) {
    try { const dir = await getDir(root, t, false); return { dir, fh: await dir.getFileHandle(LOG_FILE), path: t }; }
    catch (e) { if (e.name !== 'NotFoundError' && e.name !== 'TypeMismatchError') throw e; }

async function loadInvoices(force) {

let custCache = null, custCacheKey = '';
const ckey = (name, phone) => { const d = digits(phone); return d.length >= 7 ? 'p' + d.slice(-10) : 'n' + String(name || '').trim().toLowerCase().replace(/\s+/g, ' '); };
function customers() {
  const key = INV.length + '|' + DB.savedAt;
  if (custCache && custCacheKey === key) return custCache;
  const map = new Map(), byName = new Map();
  const get = (name, phone) => {
    name = String(name || '').trim(); if (!name && !digits(phone)) return null;
    let k = ckey(name, phone);
    if (k[0] === 'n' && byName.has(k.slice(1))) k = byName.get(k.slice(1));
    let c = map.get(k);
    if (!c) { c = { key: k, name, phone: fmtPhone(phone), email: '', addr: '', inv: [], tix: [], spent: 0, last: 0, first: Infinity, unpaid: 0 }; map.set(k, c); }
    if (name && k[0] === 'p' && !byName.has(name.toLowerCase().replace(/\s+/g, ' '))) byName.set(name.toLowerCase().replace(/\s+/g, ' '), k);
    if (!c.name && name) c.name = name;
    return c;
  };
  // phone-keyed records first so name-only records can attach to them
  const invSorted = [...INV].sort((a, b) => (digits(b.phone).length >= 7) - (digits(a.phone).length >= 7));
  for (const e of invSorted) {
    const c = get(e.name, e.phone); if (!c) continue;
    c.inv.push(e); if (isRev(e)) c.spent += e.total; if (e.status === 'unpaid') c.unpaid += e.total;
    c.last = Math.max(c.last, e.t); c.first = Math.min(c.first, e.t); if (!c.addr && e.addr) c.addr = e.addr;
  }
  for (const t of DB.tickets) {
    const c = get(t.name, t.phone); if (!c) continue;
    c.tix.push(t); const tt = Date.parse(t.created) || 0; c.last = Math.max(c.last, tt); c.first = Math.min(c.first, tt);
    if (t.email) c.email = t.email; if (t.addr && !c.addr) c.addr = t.addr; if (t.phone && !c.phone) c.phone = fmtPhone(t.phone);
  }
  for (const c of map.values()) {
    c.inv.sort((a, b) => b.t - a.t); c.visits = c.inv.length + c.tix.filter(t => !t.invno || !c.inv.some(e => e.invno === t.invno)).length;
    const o = DB.custNotes[c.key]; c.origName = c.name; if (o && o.name) c.name = o.name;   // name added in the dashboard wins
    if (o && o.email && !c.email) c.email = o.email;                    // email / phone saved with the customer (e.g. from Wix contacts)
    if (o && o.phone && !c.phone) c.phone = fmtPhone(o.phone);

}

function ticketMatches(t) {

/* ---- ⏱ labor timer: t.timeLog = [{s, e}], t.timerStart while running; total goes to the invoice's Time field ---- */
const timeMins = t => Math.round((t.timeLog || []).reduce((s, x) => s + (Date.parse(x.e) - Date.parse(x.s)), 0) / 6e4 + (t.timerStart ? (Date.now() - Date.parse(t.timerStart)) / 6e4 : 0));
const fmtMins = m => m < 60 ? `${m} min` : `${Math.floor(m / 60)} hr${m >= 120 ? 's' : ''}${m % 60 ? ' ' + (m % 60) + ' min' : ''}`;
function drawTimer() {
  const el = $('#ttimer'); if (!el || !tmp) return; const m = timeMins(tmp), run = !!tmp.timerStart;
  el.innerHTML = `<span>⏱ Labor time: <b>${m || run ? fmtMins(m) : 'not started'}</b>${run ? ' <span class="tag timer">running</span>' : ''}</span>
    <button type="button" class="btn sm ${run ? '' : 'ok'}" onclick="timerToggle()">${run ? '⏸ Stop' : m ? '▶ Resume' : '▶ Start timer'}</button>${(tmp.timeLog || []).length && !run ? '<button type="button" class="btn sm" onclick="timerReset()">Reset</button>' : ''}`;
}
function timerSave() {           // the timer keeps going even if the ticket window is closed without saving
  const d = DB.tickets.find(x => x.id === tmp.id);
  if (d) { d.timeLog = JSON.parse(JSON.stringify(tmp.timeLog || [])); d.timerStart = tmp.timerStart || null; upsert('tickets', d); }
  drawTimer();
}
function timerToggle() {
  const now = nowISO();
  if (tmp.timerStart) { (tmp.timeLog = tmp.timeLog || []).push({ s: tmp.timerStart, e: now }); tmp.timerStart = null; toast(`Timer stopped — ${fmtMins(timeMins(tmp))} total.`); }
  else tmp.timerStart = now;
  timerSave();
}
function timerReset() { if (!confirm('Reset the labor time on this ticket to zero?')) return; tmp.timeLog = []; tmp.timerStart = null; timerSave(); }
setInterval(() => { if ($('#ttimer') && tmp && tmp.timerStart) drawTimer(); }, 30000);

}
function overlay(html, cls) {        // a layer above everything (even the ticket window); returns the element

  document.body.appendChild(ov); return ov;
}

  ov.onclick = e => { const b = e.target.closest('[data-i]'); if (e.target === ov || b) ov.remove(); if (b && b.dataset.i !== 'x') items[+b.dataset.i][1](); };

/* ---- 📦 Pickup checklist: payment, accessories back, tested with the customer, pickup signature → Picked Up ---- */
function pickupFlow(id) {
  const t = DB.tickets.find(x => x.id === id); if (!t) return;
  if (!$('#modal').hidden && tmp && tmp.id === id && modalDirty && !confirm('Save the changes on this ticket first?\n\nOK = save and continue · Cancel = go back')) return;
  if (!$('#modal').hidden && tmp && tmp.id === id && modalDirty) saveTicket();
  const st = { acc: {}, tested: false, sig: t.sigOut || null };
  const ov = overlay('<div class="ob pk"></div>');
  const draw = () => {
    const e = invoiceFor(t), acc = t.accessories || [];
    const pay = e ? (e.status === 'paid' ? `<span class="tag green">✓ Paid #${esc(e.invno)}</span> <span class="muted small">${esc(e.paidMethod || '')}</span>`
        : e.status === 'unpaid' ? `<div><span class="tag red">Unpaid #${esc(e.invno)} · ${money(e.total)}</span></div><div class="small muted" style="margin:6px 0 4px">Paid now by:</div><div class="paygrid">${PAY_METHODS.map(m => `<button class="btn sm" data-pay="${esc(m)}">${esc(m)}</button>`).join('')}</div>`
        : `<span class="tag">Invoice #${esc(e.invno)}</span>`)
      : `<div class="small muted" style="margin-bottom:6px">No invoice yet${t.estimate ? ` · estimate ${money(num(t.estimate) - num(t.deposit))} due` : ''}.</div><button class="btn sm pri" data-a="inv">🧾 Make invoice</button>`;
    const ok = { pay: !!e && e.status === 'paid', acc: acc.every(a => st.acc[a]), tested: st.tested, sig: !!st.sig };
    const step = (done, title, body) => `<div class="pk-step ${done ? 'ok' : ''}"><div class="pk-h"><span class="pk-c">${done ? '✓' : ''}</span>${title}</div><div class="pk-b">${body}</div></div>`;
    ov.querySelector('.pk').innerHTML = `<div style="font-weight:700;font-size:17px">📦 Pickup — #${t.no} ${esc(t.name)}</div><div class="small muted" style="margin:2px 0 12px">${esc(devName(t))}</div>
      ${step(ok.pay, '1. Payment', pay)}
      ${step(ok.acc, '2. Return what they left', acc.length ? `<div class="chk">${acc.map(a => `<label><input type="checkbox" data-acc="${esc(a)}" ${st.acc[a] ? 'checked' : ''}> ${esc(a)}</label>`).join('')}</div>` : '<span class="muted small">Nothing was left with the device.</span>')}
      ${step(ok.tested, '3. Show it working', `<label class="row small" style="gap:8px"><input type="checkbox" data-a="tested" ${st.tested ? 'checked' : ''}> Customer saw the device working${t.backup ? ' and their data is there' : ''}</label>`)}
      ${step(ok.sig, '4. Pickup signature', st.sig ? `<img src="${st.sig.d}" alt="" style="max-height:60px;background:#fff;border-radius:4px"> <button class="btn sm" data-a="sig">Sign again</button>` : '<button class="btn sm pri" data-a="sig">✍️ Customer signs</button>')}
      <div class="row" style="margin-top:14px"><button class="btn" data-a="x">Cancel</button><span class="grow"></span><button class="btn pri" data-a="done">${Object.values(ok).every(Boolean) ? '✓ Complete pickup' : 'Complete pickup anyway'}</button></div>`;
  };
  draw();
  ov.onchange = e => { const a = e.target.dataset.acc; if (a) st.acc[a] = e.target.checked; if (e.target.dataset.a === 'tested') st.tested = e.target.checked; draw(); };
  ov.onclick = async e => {
    const b = e.target.closest('[data-a],[data-pay]'); if (e.target === ov) return ov.remove(); if (!b) return;
    if (b.dataset.pay) { const inv = invoiceFor(t); b.disabled = true;
      try { await setInvoicePay(inv.id, { status: 'paid', paidDate: longDate(new Date()), paidMethod: b.dataset.pay, paidNote: '' }); toast(`Invoice ${inv.invno} marked paid (${b.dataset.pay}).`); }
      catch (err) { toast('Could not mark it paid: ' + err.message, 'err'); }
      return draw(); }
    const a = b.dataset.a;
    if (a === 'x') ov.remove();
    if (a === 'inv') { ov.remove(); openInvoice(id); }
    if (a === 'sig') sigPad('sigOut', { name: t.name, done: sg => { st.sig = sg; draw(); } });
    if (a === 'done') {
      const tt = DB.tickets.find(x => x.id === id);
      if (st.sig) tt.sigOut = st.sig;
      const missing = [(t.accessories || []).filter(x => !st.acc[x]).length ? 'not all items returned' : '', !st.tested ? 'not shown working' : ''].filter(Boolean);
      const accs = tt.accessories || [], back = accs.filter(x => st.acc[x]);
      const itemsNote = !accs.length ? '' : back.length === accs.length ? 'all items returned' : `items returned: ${back.join(', ') || 'none'}`;
      (tt.notes = tt.notes || []).push({ t: nowISO(), x: 'Picked up — checklist: ' + [invoiceFor(tt)?.status === 'paid' ? 'paid' : 'NOT marked paid', itemsNote, st.tested ? 'shown working' : 'not shown working', st.sig ? 'signed' : 'not signed'].filter(Boolean).join(', ') + '.' });
      ov.remove(); if (!$('#modal').hidden && tmp && tmp.id === id) closeModal(true);
      setStatus(id, 'done', true);
      toast(`#${t.no} picked up${missing.length ? ' (' + missing.join(', ') + ')' : ''}.`, '', [['⭐ Ask for a review', () => msgOpen(id, 'msgReview')]]);
    }
  };
}

// then uploaded to <RCR>/<dataPath>/Photos/Ticket <no>/ and listed on the ticket (t.photos = [{f, t}]).
const photoURL = new Map();          // file name → object URL for thumbnails
async function shrinkImage(file, max, q) {
  let src, w, h;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); w = src.width; h = src.height; }
  catch { src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('that file is not a picture')); i.src = URL.createObjectURL(file); }); w = src.naturalWidth; h = src.naturalHeight; }
  const s = Math.min(1, max / Math.max(w, h)), c = document.createElement('canvas');
  c.width = Math.round(w * s); c.height = Math.round(h * s); c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('could not compress the picture')), 'image/jpeg', q));
}
async function addPhotos(input) {
  const files = [...input.files]; input.value = '';

      const name = `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())} ${p2(d.getHours())}.${p2(d.getMinutes())}.${p2(d.getSeconds())} ${Math.random().toString(36).slice(2, 5)}.jpg`;
      await idb.set('photo:' + name, blob);
      (tmp.photos = tmp.photos || []).push({ f: name, t: nowISO(), pending: true });
      photoURL.set(name, URL.createObjectURL(blob));
    } catch (e) { toast('Could not add that photo: ' + e.message, 'err'); }
  }
  modalDirty = true; drawPhotos();
}
const photoDir = (t, create) => getDir(folder, `${S().dataPath}/Photos/Ticket ${t.no}`, create);
async function photoSrc(t, p) {
  if (photoURL.has(p.f)) return photoURL.get(p.f);
  let blob = await idb.get('photo:' + p.f).catch(() => null);
  if (!blob && folder && folderOK && t.no) {
    const f = await (await (await photoDir(t, false)).getFileHandle(p.f)).getFile();
    blob = f instanceof Blob ? f : await f.blob();         // a real File on the computer, a Drive file object in the web app
  }

}
function drawPhotos() {
  const el = $('#tphotos'); if (!el || !tmp) return; const ps = tmp.photos || [];

  el.innerHTML = ps.length ? ps.map((p, i) => `<div class="ph" onclick="viewPhoto(${i})" data-f="${esc(p.f)}">…${p.pending ? '<span class="up" title="Uploads to Drive when the ticket is saved">⏳</span>' : ''}</div>`).join('') : '<div class="muted small" style="grid-column:1/-1">No photos yet.</div>';
  const t = tmp;

    .catch(() => { const d = el.querySelector(`[data-f="${CSS.escape(p.f)}"]`); if (d) d.textContent = 'Not found'; }));
}

let uploading = false;
async function uploadPhotos() {       // send photos taken on this device to Drive (runs after saving and when Drive connects)
  if (uploading || !folder || !folderOK) return; uploading = true;
  try {
    for (const t of DB.tickets.filter(x => x.no && (x.photos || []).some(p => p.pending))) {
      const d = await photoDir(t, true); let changed = false;
      for (const p of t.photos.filter(p => p.pending)) {
        const blob = await idb.get('photo:' + p.f);
        if (blob) { await writeBlob(d, p.f, blob); await idb.del('photo:' + p.f); }
        else { try { await d.getFileHandle(p.f); } catch { continue; } }   // taken on another device and not uploaded yet

// Signatures: drawn with a finger, stored on the ticket as a small PNG (t.sigIn = drop-off, t.sigOut = pickup)
function drawSigs() {
  const el = $('#tsigs'); if (!el || !tmp) return;
  const one = (k, l) => { const s = tmp[k]; return `<div class="sig">${s ? `<img src="${s.d}" alt=""><div>${l} · ${fmtTs(s.t)}</div><button type="button" class="btn sm" onclick="sigPad('${k}')">Sign again</button>` : `<div>${l}</div><button type="button" class="btn sm pri" onclick="sigPad('${k}')">✍️ Sign</button>`}</div>`; };
  el.innerHTML = one('sigIn', 'Drop-off') + one('sigOut', 'Pickup');
}
function sigPad(kind, opts) {        // opts.name / opts.done(sig) let the pickup checklist use it without the ticket window
  opts = opts || {};
  const ov = overlay(`<div class="ob"><div style="margin-bottom:6px"><b>${kind === 'sigIn' ? 'Drop-off' : 'Pickup'} signature</b> <span class="muted small">— ${esc(opts.name || (tmp && tmp.name) || 'customer')}, please sign below${kind === 'sigIn' ? ' to agree to the repair terms' : ' to confirm you picked up your device'}</span></div>
    <canvas id="sigcanvas"></canvas>
    <div class="row" style="margin-top:10px"><button class="btn" data-a="clear">Clear</button><span class="grow"></span><button class="btn" data-a="x">Cancel</button><button class="btn pri" data-a="ok">Save signature</button></div></div>`);
  const c = ov.querySelector('canvas'), r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
  const g = c.getContext('2d'); g.scale(dpr, dpr); g.lineWidth = 2.6; g.lineCap = g.lineJoin = 'round'; g.strokeStyle = g.fillStyle = '#111';
  let drawing = false, any = false, last;
  const pt = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.onpointerdown = e => { e.preventDefault(); drawing = any = true; last = pt(e); try { c.setPointerCapture(e.pointerId); } catch { } g.beginPath(); g.arc(last[0], last[1], 1.2, 0, 7); g.fill(); };
  c.onpointermove = e => { if (!drawing) return; e.preventDefault(); const p = pt(e); g.beginPath(); g.moveTo(last[0], last[1]); g.lineTo(p[0], p[1]); g.stroke(); last = p; };
  c.onpointerup = c.onpointercancel = () => { drawing = false; };
  ov.onclick = e => {
    const a = e.target.dataset.a; if (!a) return;
    if (a === 'clear') { g.clearRect(0, 0, c.width, c.height); any = false; }
    if (a === 'x') ov.remove();
    if (a === 'ok') {
      if (!any) return toast('Please sign in the box first.', 'err');
      const o = document.createElement('canvas'), w = Math.min(480, c.width); o.width = w; o.height = Math.round(c.height * w / c.width);
      const og = o.getContext('2d'); og.fillStyle = '#fff'; og.fillRect(0, 0, o.width, o.height); og.drawImage(c, 0, 0, o.width, o.height);
      const px = og.getImageData(0, 0, o.width, o.height), a = px.data;    // pure black & white keeps the PNG tiny (it's synced with the tickets)
      for (let i = 0; i < a.length; i += 4) { const v = a[i] < 170 ? 0 : 255; a[i] = a[i + 1] = a[i + 2] = v; a[i + 3] = 255; }
      og.putImageData(px, 0, 0);
      const sg = { d: o.toDataURL('image/png'), t: nowISO() }; ov.remove();
      if (opts.done) return opts.done(sg);
      tmp[kind] = sg; modalDirty = true; drawSigs();
      toast('Signature added — tap Save to keep it.');
    }
  };
}

// Barcode / QR scan with the camera (Chrome on Android, Chrome/Edge on computers). iPhone browsers can't read barcodes yet.
async function scanInto(input) {
  if (!('BarcodeDetector' in window) || !navigator.mediaDevices?.getUserMedia)
    return alert('This browser can\'t read barcodes yet (iPhones don\'t support it).\n\nOn an iPhone instead: tap the Serial box, tap it once more and choose "Scan Text" — point the camera at the label and tap Insert.');
  let det; try { const f = await BarcodeDetector.getSupportedFormats(); det = new BarcodeDetector(f.length ? { formats: f } : undefined); } catch (e) { return toast('Barcode reading is not available: ' + e.message, 'err'); }
  let stream; try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 } }, audio: false }); }
  catch (e) { return toast('The camera could not start: ' + e.message, 'err'); }
  const ov = overlay(`<video playsinline muted autoplay></video><div class="frame"></div><div class="bar"><span style="flex:1">Point at the barcode or QR code on the label</span><button class="btn">Cancel</button></div>`, 'scanner');
  const v = ov.querySelector('video'); v.srcObject = stream; v.play().catch(() => { });
  let done = false; const stop = () => { done = true; stream.getTracks().forEach(t => t.stop()); ov.remove(); };
  ov.querySelector('button').onclick = stop;
  const tick = async () => {
    if (done) return;
    try { const hit = (await det.detect(v)).find(x => (x.rawValue || '').trim());
      if (hit) { input.value = hit.rawValue.trim(); input.dispatchEvent(new Event('input', { bubbles: true })); if (navigator.vibrate) navigator.vibrate(80); stop(); modalDirty = true; toast('Scanned: ' + input.value); return; } } catch { }
    setTimeout(tick, 220);
  };
  v.addEventListener('loadeddata', tick, { once: true });
}

// Import a Wix contacts export (CSV). Only people not already listed, from the last 2 years, are added.
function parseCSV(t) {
  const out = []; let row = [], cur = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; row.push(cur); out.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur || row.length) { row.push(cur); out.push(row); }

}

  if (iE < 0 && iP < 0) return toast("Couldn't find email or phone columns in that file.", 'err');
  const have = new Set(); for (const l of DB.leads || []) { const p = digits(l.phone).slice(-10); if (p.length === 10) have.add('p' + p); if (l.email) have.add('e' + l.email.toLowerCase()); }

    if (!email && phone.length < 10) continue;
    if ((phone.length === 10 && have.has('p' + phone)) || (email && have.has('e' + email))) { dup++; continue; }
    const dt = iD >= 0 ? new Date(r[iD]) : new Date(), created = isNaN(dt) ? today() : dt.toISOString().slice(0, 10);
    if (created < cutoff) { old++; continue; }
    const name = (iN >= 0 ? r[iN] : [iF >= 0 ? r[iF] : '', iL >= 0 ? r[iL] : ''].join(' ')).replace(/\s+/g, ' ').trim();
    const l = { id: uid(), name, email, phone: phone.length === 10 ? phone : '', created, status: LEAD_SPAM.test(email + ' ' + name) ? 'spam' : 'new', notes: '', src: 'Wix CSV ' + today(), upd: nowISO() };
    DB.leads.push(l); if (l.phone) have.add('p' + l.phone); if (email) have.add('e' + email); added++;
  }
  commit(); render();
  toast(`Imported ${plural(added, 'new lead')}${dup ? ` · ${dup} already listed` : ''}${old ? ` · ${old} older than 2 years skipped` : ''}.`);
}

/* ---- Quick "Mark paid": writes the paid status straight into the invoice log (same fields the Invoice Form uses) ---- */
const PAY_METHODS = ['Cash', 'Card', 'Check', 'Zelle', 'Venmo', 'Cash App', 'PayPal', 'Other'];
const canPay = e => e && e.status !== 'paid' && e.status !== 'quote' && !/quote/i.test(e.kind || '');
const payBtn = (e, cls) => canPay(e) ? `<button class="btn sm ok ${cls || ''}" title="Mark invoice ${esc(e.invno)} paid" onclick="event.stopPropagation();payModal(${js(e.id)})">💵 Paid</button>` : '';
const longDate = d => d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
function payModal(id) {
  const e = INV.find(x => x.id === id); if (!e) return;

  const today = new Date(), iso = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
  const last = localStorage.getItem('rcr-paymethod') || 'Cash';
  modal(`💵 Mark invoice ${esc(e.invno || '')} paid`, `<div style="margin-bottom:10px"><b>${esc(nameFor(e) || fmtPhone(e.phone))}</b> · ${esc(e.job)} · <b>${money(e.total)}</b></div>
    <div class="small muted" style="margin-bottom:6px">How did they pay? (click one to mark it paid)</div>
    <div class="paygrid">${PAY_METHODS.map(m => `<button class="btn ${m === last ? 'ok' : ''}" onclick="doPay(${js(id)},${js(m)})">${m}</button>`).join('')}</div>
    <div class="row2" style="margin-top:12px"><label>Paid on<input type="date" id="paydate" value="${iso}"></label><label>Note (optional)<input id="paynote" placeholder="e.g. check #1234, last 4 of card"></label></div>`,
    `<button class="btn" onclick="closeModal()">Cancel</button>`);

async function doPay(id, method) {
  const dv = $('#paydate') && $('#paydate').value, note = ($('#paynote') && $('#paynote').value || '').trim();
  const pay = { status: 'paid', paidDate: longDate(dv ? new Date(dv + 'T12:00') : new Date()), paidMethod: method, paidNote: note };
  try {
    const before = await setInvoicePay(id, pay);
    localStorage.setItem('rcr-paymethod', method);
    closeModal(true);
    const e = INV.find(x => x.id === id);
    toast(`Invoice ${e ? e.invno : ''} marked paid (${method}).`, 'ok', [['Undo', () => setInvoicePay(id, before).then(() => toast('Undone — back to unpaid.')).catch(err => toast('Undo failed: ' + err.message, 'err'))]]);
  } catch (err) { if (err.name === 'AuthError') { folderOK = false; setSync('reconnect'); } toast('Could not mark it paid: ' + err.message + (err.name === 'AuthError' ? ' — tap "Sign in again" at the top, then try again.' : ''), 'err'); }
}
// Reads the log fresh from the folder, changes only this invoice's payment fields, writes it back. Returns the old values (for Undo).
async function setInvoicePay(id, pay) {
  if (!folder || !folderOK) throw new Error('the RCR folder is not connected');
  for (const p of S().logPaths) {
    const r = await findLog(folder, p); if (!r) continue;
    const log = parseJSON(await (await r.fh.getFile()).text());
    if (!Array.isArray(log)) continue;
    const e = log.find(x => slim(x).id === id); if (!e) continue;
    const before = { status: e.status ?? e.data?.status ?? 'unpaid', paidDate: e.paidDate || '', paidMethod: e.paidMethod || '', paidNote: e.paidNote || '' };
    Object.assign(e, pay); if (e.data) Object.assign(e.data, pay);
    const text = JSON.stringify(log, null, 1);
    if (!Array.isArray(JSON.parse(text)) || JSON.parse(text).length !== log.length) throw new Error('safety check failed, nothing was written');
    await writeText(r.dir, LOG_FILE, text);
    const s = INV.find(x => x.id === id); if (s) Object.assign(s, { status: pay.status, paidDate: pay.paidDate, paidMethod: pay.paidMethod });
    custCache = null; idb.set('inv', { INV, invInfo }).catch(() => {});
    invMod[p] = (await r.fh.getFile()).lastModified;
    render();
    return before;
  }
  throw new Error('that invoice was not found in the invoice log');
}

  el.innerHTML = `<span title="Days since the oldest invoice in the log">⚡ Uptime: ${y ? y + 'y ' : ''}${m}m ${Math.round(d % 365 % 30.4)}d</span><br>${INV.length.toLocaleString()} invoices served · 0 BSODs today<br><br>`;
}
const KONAMI = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a']; let kPos = 0;
function konami(e) {
  kPos = e.key === KONAMI[kPos] ? kPos + 1 : (e.key === KONAMI[0] ? 1 : 0);
  if (kPos === KONAMI.length) { kPos = 0; const on = document.documentElement.dataset.theme !== 'terminal'; setTheme(on ? 'terminal' : ''); toast(on ? '> CHEAT CODE ACCEPTED. +30 lives. Terminal mode enabled.' : 'Back to normal. Your secret is safe with us.'); }

async function importData(file) {

    const stamp = nowISO(); COLLS.forEach(c => d[c].forEach(r => r.upd = stamp)); d.settingsUpd = stamp;

/* ============ global search ============ */
let gsel = 0;
function gsearch(q) {
  const box = $('#gres'); q = q.trim().toLowerCase(); const qd = digits(q);
  if (q.length < 2) { box.hidden = true; return; }
  const tk = DB.tickets.filter(t => [t.no, t.name, t.email, t.make, t.model, t.serial, t.issue, t.invno].join(' ').toLowerCase().includes(q.replace(/^#/, '')) || (qd.length >= 3 && digits(t.phone).includes(qd))).slice(0, 6);
  const cs = customers().filter(c => c.name.toLowerCase().includes(q) || (qd.length >= 3 && digits(c.phone).includes(qd))).sort((a, b) => b.last - a.last).slice(0, 6);
  const iv = INV.filter(e => String(e.invno) === q || (q.length >= 3 && [e.invno, nameFor(e), e.job, e.model].join(' ').toLowerCase().includes(q))).slice(0, 6);
  const pt = DB.parts.filter(p => [p.name, p.sku].join(' ').toLowerCase().includes(q)).slice(0, 4);
  let h = '';
  if (tk.length) h += '<div class="h">Tickets</div>' + tk.map(t => `<div class="it" onmousedown="editTicket('${t.id}')"><b>#${t.no}</b> ${esc(t.name)} — ${esc(devName(t))} ${badge(t.status)}</div>`).join('');
  if (cs.length) h += '<div class="h">Customers</div>' + cs.map(c => `<div class="it" onmousedown="custModal(${js(c.key)})">${esc(c.name)} <small>${esc(c.phone)} · ${plural(c.visits, 'visit')}</small></div>`).join('');
  if (iv.length) h += '<div class="h">Invoices</div>' + iv.map(e => `<div class="it" onmousedown="invModal(${js(e.id)})"><b>${esc(e.invno || '—')}</b> ${esc(nameFor(e))} <small>${esc(e.date)} · ${esc(e.job)} · ${money(e.total)}</small></div>`).join('');
  if (pt.length) h += '<div class="h">Parts</div>' + pt.map(p => `<div class="it" onmousedown="editPart('${p.id}')">${esc(p.name)} <small>${num(p.qty)} in stock</small></div>`).join('');
  box.innerHTML = h || '<div class="it muted">No matches</div>'; box.hidden = false; gsel = 0; markSel();
}
function markSel() { $$('#gres .it').forEach((el, i) => el.classList.toggle('sel', i === gsel)); }
function gkey(e) {
  const items = $$('#gres .it'); if ($('#gres').hidden || !items.length) return;
  if (e.key === 'ArrowDown') { gsel = Math.min(items.length - 1, gsel + 1); markSel(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { gsel = Math.max(0, gsel - 1); markSel(); e.preventDefault(); }
  else if (e.key === 'Enter') { items[gsel].dispatchEvent(new MouseEvent('mousedown')); $('#gres').hidden = true; e.target.blur(); }
}

/* ============ keyboard + startup ============ */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { $('#gres').hidden = true; if (!$('#modal').hidden) closeModal(); return; }
  const tag = document.activeElement?.tagName || '';
  if (/INPUT|TEXTAREA|SELECT/.test(tag) || e.ctrlKey || e.metaKey || e.altKey || !$('#modal').hidden) return;
  konami(e); if (kPos > 0 && !/^[nNiI/0-9]$/.test(e.key)) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); editTicket(); }
  else if (e.key === 'i' || e.key === 'I') { e.preventDefault(); openInvoice(); }
  else if (e.key === '/') { e.preventDefault(); $('#gq').focus(); }
  else if (/^[0-9]$/.test(e.key)) go(Object.keys(VIEWS)[(+e.key || 10) - 1]);
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  // web app reopened after the 1-hour Google sign-in ran out: renew it quietly (not while a ticket/window is open)
  if (HOSTED && !RCRDrive.signedIn() && RCRDrive.wasSignedIn()) { if ($('#modal').hidden) RCRDrive.signIn({ silent: true }); return; }
  if (folderOK && !pending) pullFromFolder();
});
window.addEventListener('beforeunload', e => { if (HOSTED && !RCRDrive.signedIn()) return; if (pending && folderOK) { flush(); e.preventDefault(); e.returnValue = ''; } });
setInterval(() => { if (document.visibilityState === 'visible' && folderOK && !pending) pullFromFolder(); }, 120000);
