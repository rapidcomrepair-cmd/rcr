<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RCR Dashboard</title>
<link rel="icon" id="favicon" href="data:,">
<script src="../shared/rcr-drive.js"></script><!-- Google Drive saving for the web app version; unused when opened from the computer -->
<style>
  :root { --bg:#f2f4f8; --card:#fff; --ink:#1b2333; --mut:#6b7486; --line:#e2e6ee; --accent:#1d5fd1; --accent2:#e8f0fe;
          --side:#121a2b; --good:#16a34a; --warn:#d97706; --bad:#dc2626; --r:10px; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 "Segoe UI", system-ui, Arial, sans-serif; color:var(--ink); background:var(--bg); }
  a { color:var(--accent); }
  button, input, select, textarea { font:inherit; color:inherit; }
  #app { display:grid; grid-template-columns:220px 1fr; min-height:100vh; }
  aside { background:var(--side); color:#cfd6e4; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; padding:14px 10px; overflow:auto; }
  .brand { display:flex; align-items:center; gap:10px; padding:2px 8px 16px; color:#fff; font-weight:700; font-size:15px; line-height:1.15; }
  .brand img { width:42px; height:42px; border-radius:8px; background:#fff; object-fit:contain; padding:2px; }
  .brand small { display:block; font-weight:400; color:#8f9ab0; font-size:11px; }
  nav a { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; color:#cfd6e4; text-decoration:none; margin:1px 0; cursor:pointer; user-select:none; }
  nav a:hover { background:#1e2940; }
  nav a.on { background:var(--accent); color:#fff; }
  nav a .ct { margin-left:auto; background:#2b3854; border-radius:10px; padding:0 7px; font-size:11px; }
  nav a .ct.hot { background:var(--bad); color:#fff; }
  nav a.on .ct { background:rgba(255,255,255,.25); }
  nav .sep { height:1px; background:#26314a; margin:10px 6px; }
  nav .navgrp { font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#7f8bab; margin:12px 10px 4px; }
  nav .navgrp:first-child { margin-top:2px; }
  details.cfold { margin-bottom:14px; }
  details.cfold > summary.bh { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; font-size:14px; }
  details.cfold[open] > summary.bh { margin-bottom:12px; }
  .card.fc > h3 { cursor:pointer; }
  .card.fc > h3::after { content:'▾'; margin-left:8px; color:var(--mut); font-weight:400; }
  .card.fc.folded > h3::after { content:'▸'; }
  .card.fc.folded > :not(h3) { display:none !important; }
  .card.fc.folded > h3 { margin-bottom:0; }
  .side-foot { margin-top:auto; font-size:11px; color:#8f9ab0; padding:8px; }
  main { min-width:0; }
  .top { position:sticky; top:0; z-index:5; background:rgba(242,244,248,.94); backdrop-filter:blur(6px); display:flex; align-items:center; gap:12px; padding:12px 22px; border-bottom:1px solid var(--line); }
  .top h1 { font-size:19px; margin:0; white-space:nowrap; }
  .search { position:relative; flex:1; max-width:460px; margin-left:auto; }
  .search input { width:100%; padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  #gres { position:absolute; top:40px; left:0; right:0; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.15); max-height:70vh; overflow:auto; z-index:30; }
  #gres .h { font-size:11px; text-transform:uppercase; color:var(--mut); padding:8px 12px 2px; letter-spacing:.04em; }
  #gres .it { padding:7px 12px; cursor:pointer; }
  #gres .it:hover, #gres .it.sel { background:var(--accent2); }
  #gres .it small { color:var(--mut); }
  .sync { font-size:12px; padding:5px 10px; border-radius:20px; background:#fff; border:1px solid var(--line); cursor:pointer; white-space:nowrap; }
  .sync.saved { color:var(--good); } .sync.warn { color:var(--warn); border-color:#f3d39b; background:#fff8eb; } .sync.err { color:var(--bad); border-color:#f5b5b5; background:#fff1f1; }
  .content { padding:20px 22px 40px; }
  .btn { border:1px solid var(--line); background:#fff; padding:7px 12px; border-radius:8px; cursor:pointer; white-space:nowrap; }
  .btn:hover { border-color:#b8c2d6; }
  a.btn { text-decoration:none; color:inherit; display:inline-block; }
  .btn.pri { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.pri:hover { background:#174fb0; }
  .btn.danger { color:var(--bad); }
  .btn.sm { padding:3px 8px; font-size:12px; border-radius:6px; }
  .btn.on { background:var(--accent2); border-color:var(--accent); color:var(--accent); }
  .btn.ok { background:#16a34a; border-color:#16a34a; color:#fff; } .btn.ok:hover { background:#128a3e; }
  .paygrid { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; } .paygrid .btn { padding:10px 6px; font-weight:600; }
  .row2 { display:grid; grid-template-columns:1fr 2fr; gap:10px; } .row2 label { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--mut); }
  .row2 input { padding:7px 9px; border:1px solid var(--line); border-radius:8px; font:inherit; color:var(--ink, inherit); background:var(--card, #fff); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1; }
  .qschips { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 10px; } #qsf .row2 { grid-template-columns:minmax(0,1fr) minmax(0,1fr); margin-bottom:8px; } #qsf label { min-width:0; } #qsf input, #qsf select { width:100%; min-width:0; box-sizing:border-box; } #qsf .fl { margin-bottom:6px; }
  #qf .row2 { grid-template-columns:minmax(0,1fr) minmax(0,1fr); margin-bottom:8px; } #qf label { min-width:0; } #qf input:not([type=checkbox]) { width:100%; min-width:0; box-sizing:border-box; }
  #qf .inp, #qf .qpart input, #qf .ql input { padding:7px 9px; border:1px solid var(--line); border-radius:8px; font:inherit; color:var(--ink); background:var(--card, #fff); }
  #qf .sec-h { margin:12px 0 2px; }
  .qpart { display:grid; grid-template-columns:minmax(0,1fr) 96px; gap:6px; } .qpart .qpa { grid-column:1 / 3; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .ql { display:grid; grid-template-columns:minmax(0,1fr) 92px 30px; gap:6px; margin-bottom:6px; align-items:center; }
  #qlines.pf .ql { grid-template-columns:minmax(0,1fr) 74px 84px 30px; }
  .ql button { border:0; background:none; color:var(--bad); font-size:18px; cursor:pointer; } .ql .qcl { font-size:11px; color:var(--mut); text-align:center; }
  .chk1 { display:flex; gap:8px; align-items:center; margin:10px 0 4px; font-size:13.5px; }
  .impit { display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; background:var(--card); }
  .impit.dup { opacity:.6; } .impit .ck { padding-top:8px; } .impit .ck input { width:20px; height:20px; } .impit .grow { min-width:0; } .impit .grow > .inp { width:100%; box-sizing:border-box; font-weight:600; }
  .impmeta { display:grid; grid-template-columns:70px 110px minmax(0,1fr); gap:8px; margin-top:6px; } .impmeta label { display:flex; flex-direction:column; gap:2px; font-size:11.5px; color:var(--mut); min-width:0; } .impmeta .inp { width:100%; box-sizing:border-box; }
  .imptot { margin:10px 0 2px; font-size:14px; }
  .gmrow { display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; background:var(--card); } .gmrow .grow { min-width:0; } .gmrow .grow > div { margin-bottom:3px; }
  .gmbtn { display:flex; flex-direction:column; gap:6px; }
  .impchk { display:flex; gap:8px; align-items:flex-start; font-size:13px; margin:4px 0; cursor:pointer; } .impchk input { margin-top:2px; flex:0 0 auto; }
  .qstot { text-align:right; font-size:18px; margin-top:12px; } .qstot b { font-size:22px; margin-left:6px; }
  .qsrcpt { white-space:pre-wrap; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font:13px/1.45 ui-monospace, Consolas, monospace; margin:0; }
  .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .toolbar input[type=search], .toolbar select { padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .toolbar input[type=search] { min-width:240px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#fff; }
  .seg button { border:0; background:none; padding:7px 12px; cursor:pointer; border-right:1px solid var(--line); }
  .seg button:last-child { border-right:0; }
  .seg button.on { background:var(--accent); color:#fff; }
  .grid { display:grid; gap:14px; }
  .kpis { grid-template-columns:repeat(auto-fill, minmax(175px, 1fr)); margin-bottom:14px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:13px 15px; cursor:pointer; transition:box-shadow .15s; }
  .kpi:hover { box-shadow:0 4px 14px rgba(20,30,60,.08); }
  .kpi .l { color:var(--mut); font-size:12px; }
  .kpi .v { font-size:24px; font-weight:700; margin-top:2px; }
  .kpi .s { font-size:12px; color:var(--mut); margin-top:2px; }
  .kpi.alert .v { color:var(--bad); } .kpi.good .v { color:var(--good); } .kpi.warn .v { color:var(--warn); }
  .up { color:var(--good); } .down { color:var(--bad); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; min-width:0; }
  .card h3 { margin:0 0 10px; font-size:14px; display:flex; align-items:center; gap:8px; }
  .card h3 .r { margin-left:auto; font-weight:400; }
  .c2 { grid-template-columns:1.6fr 1fr; } .c3 { grid-template-columns:repeat(3, 1fr); } .c2e { grid-template-columns:1fr 1fr; }
  @media (max-width:1150px) { .c2, .c3, .c2e { grid-template-columns:1fr; } }
  .muted { color:var(--mut); } .small { font-size:12px; }
  .empty { color:var(--mut); padding:14px 4px; text-align:center; }
  table.t { width:100%; border-collapse:collapse; background:#fff; }
  table.t th { text-align:left; font-size:12px; color:var(--mut); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; position:sticky; top:var(--toph, 60px); z-index:2; background:#fff; }
  table.t td { padding:8px 10px; border-bottom:1px solid #eef1f6; vertical-align:top; }
  table.t tr.click { cursor:pointer; }
  table.t .ed { opacity:0; padding:0 5px; }
  table.t tr:hover .ed { opacity:1; }
  table.t tr.click:hover td { background:#f7f9fd; }
  table.t td.num, table.t th.num { text-align:right; white-space:nowrap; }
  .tablewrap { background:#fff; border:1px solid var(--line); border-radius:var(--r); overflow:clip; }   /* clip (not hidden) so the sticky header sticks under the top bar */
  .mbox table.t th { position:static; }
  .badge { display:inline-block; padding:1px 8px; border-radius:20px; font-size:11.5px; font-weight:600; color:#fff; white-space:nowrap; }
  .tag { display:inline-block; padding:0 6px; border-radius:5px; font-size:11px; background:#eef1f6; color:#4b5468; white-space:nowrap; }
  .tag.red { background:#fde8e8; color:var(--bad); } .tag.amber { background:#fff3dc; color:#a35d00; } .tag.green { background:#e3f6e9; color:#13803c; } .tag.blue { background:var(--accent2); color:var(--accent); }
  /* board */
  .board { display:grid; grid-template-columns:repeat(6, minmax(190px, 1fr)); gap:10px; overflow-x:auto; padding-bottom:8px; }
  .col { background:#e8ebf2; border-radius:var(--r); padding:8px; min-height:300px; }
  .col.over { outline:2px dashed var(--accent); }
  .col > header { display:flex; align-items:center; gap:6px; font-weight:600; font-size:13px; padding:2px 4px 8px; }
  .col > header .dot { width:9px; height:9px; border-radius:50%; }
  .col > header .n { margin-left:auto; color:var(--mut); font-weight:400; }
  .tc { background:#fff; border-radius:8px; padding:9px 10px; margin-bottom:8px; border:1px solid var(--line); cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .tc:hover { border-color:#b8c2d6; }
  .tc .no { font-size:11px; color:var(--mut); display:flex; gap:6px; align-items:center; }
  .tc .nm { font-weight:600; margin:2px 0 1px; }
  .tc .dv { font-size:12.5px; }
  .tc .is { font-size:12px; color:var(--mut); margin-top:3px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .tc .ft { display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
  /* charts */
  svg.chart { width:100%; height:auto; display:block; }
  svg.chart text { font-size:11px; fill:#6b7486; }
  svg.chart .bar { fill:var(--accent); } svg.chart .bar.cur { fill:#5b8fe8; }
  svg.chart .bar:hover { fill:#0f3f99; }
  .hb { display:grid; grid-template-columns:150px 1fr 90px; gap:8px; align-items:center; margin:5px 0; font-size:13px; }
  .hb .trk { background:#eef1f6; border-radius:4px; height:12px; overflow:hidden; }
  .hb .trk i { display:block; height:100%; border-radius:4px; }
  .hb b { text-align:right; font-weight:600; white-space:nowrap; }
  .hb span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* lists */
  .li { display:flex; gap:10px; align-items:flex-start; padding:8px 2px; border-bottom:1px solid #eef1f6; }
  .li:last-child { border-bottom:0; }
  .li .ic { width:26px; text-align:center; font-size:16px; }
  .li .tx { flex:1; min-width:0; }
  .li .tx .s { color:var(--mut); font-size:12px; }
  .li .ac { display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
  .li.done .tx { text-decoration:line-through; color:var(--mut); }
  .sec-h { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--mut); margin:18px 0 6px; font-weight:600; }
  /* modal */
  #modal { position:fixed; inset:0; background:rgba(10,15,30,.5); z-index:40; display:flex; align-items:flex-start; justify-content:center; padding:4vh 16px; overflow:auto; }
  #modal[hidden] { display:none; }
  .mbox { background:#fff; border-radius:12px; width:560px; max-width:100%; box-shadow:0 20px 60px rgba(0,0,0,.3); }
  .mbox.wide { width:1020px; }
  .mbox > header { display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--line); }
  .mbox > header h3 { margin:0; font-size:17px; }
  .mbox > header .x { margin-left:auto; border:0; background:none; font-size:24px; line-height:1; cursor:pointer; color:var(--mut); }
  .mbody { padding:16px 18px; }
  .mbox > footer { display:flex; gap:8px; flex-wrap:wrap; padding:12px 18px; border-top:1px solid var(--line); background:#fafbfd; border-radius:0 0 12px 12px; }
  .f { display:grid; gap:10px 14px; grid-template-columns:repeat(2, 1fr); }
  .f.three { grid-template-columns:repeat(3, 1fr); }
  .f .full { grid-column:1/-1; }
  .f label, .fl { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--mut); font-weight:600; }
  .f input:not([type=checkbox]), .f select, .f textarea, .inp { padding:7px 9px; border:1px solid #d5dbe6; border-radius:7px; background:#fff; color:var(--ink); font-weight:400; font-size:14px; width:100%; }
  .f textarea { min-height:62px; resize:vertical; }
  .f input:focus, .f select:focus, .f textarea:focus, .inp:focus { outline:2px solid #b9d0fb; border-color:var(--accent); }
  .chk { display:flex; flex-wrap:wrap; gap:6px 14px; font-weight:400; color:var(--ink); font-size:13px; }
  .chk label { flex-direction:row; align-items:center; gap:5px; font-weight:400; color:var(--ink); font-size:13px; }
  .tk { display:grid; grid-template-columns:1.25fr 1fr; gap:18px; }
  @media (max-width:900px) { .tk { grid-template-columns:1fr; } .f.three { grid-template-columns:1fr 1fr; } }
  .box { border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:12px; }
  .box > .bh { font-weight:700; font-size:13px; margin-bottom:8px; display:flex; align-items:center; gap:8px; }
  /* sections that fold to one line (tap the heading); on a phone some start folded */
  details.fold > summary.bh { font-weight:700; font-size:13px; display:flex; align-items:center; gap:8px; cursor:pointer; list-style:none; margin-bottom:8px; }
  details.fold > summary.bh::-webkit-details-marker { display:none; }
  details.fold:not([open]) > summary.bh { margin-bottom:0; }
  details.fold > summary.bh::after { content:'▾'; margin-left:auto; color:var(--mut); font-weight:400; }
  details.fold:not([open]) > summary.bh::after { content:'▸'; }
  details.fold > summary .sum { display:none; }
  details.fold:not([open]) > summary .sum { display:block; font-weight:400; color:var(--mut); font-size:12.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fmore { display:none; }
  .box > .bh .r { margin-left:auto; }
  .ret { background:#f0f6ff; border:1px solid #cfe0fb; border-radius:8px; padding:8px 10px; font-size:12.5px; margin-top:8px; }
  .ret[hidden] { display:none; }
  .note { border-left:3px solid #cfd8e8; padding:2px 0 2px 9px; margin:6px 0; font-size:13px; white-space:pre-wrap; }
  .note small { display:block; color:var(--mut); }
  .pl { display:grid; grid-template-columns:1fr 80px 80px 26px 24px; gap:5px; margin-bottom:5px; align-items:center; }
  .pl input { padding:5px 7px; border:1px solid #d5dbe6; border-radius:6px; width:100%; }
  .pl button { border:0; background:none; color:var(--bad); cursor:pointer; font-size:16px; }
  /* toasts */
  #toasts { position:fixed; right:18px; bottom:18px; z-index:60; display:flex; flex-direction:column; gap:8px; }
  .toast { background:#1b2333; color:#fff; padding:10px 14px; border-radius:9px; box-shadow:0 6px 20px rgba(0,0,0,.25); display:flex; gap:10px; align-items:center; max-width:440px; }
  .toast.err { background:#9b1c1c; }
  .toast button { background:rgba(255,255,255,.15); border:0; color:#fff; padding:4px 9px; border-radius:6px; cursor:pointer; }
  .banner { background:#fff8eb; border:1px solid #f3d39b; color:#7a4a00; padding:10px 14px; border-radius:10px; margin-bottom:14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  details.inv summary { cursor:pointer; }
  kbd { background:#eef1f6; border:1px solid #d5dbe6; border-bottom-width:2px; border-radius:4px; padding:0 5px; font-size:12px; }
  /* tech tools */
  .tools { grid-template-columns:repeat(auto-fill, minmax(380px, 1fr)); align-items:start; grid-auto-flow:row dense; }
  .cmd { display:flex; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid #eef1f6; }
  .cmd:last-child { border-bottom:0; }
  .cmd code { flex:1; min-width:0; font:12px Consolas, "Cascadia Mono", monospace; background:#f3f5f9; padding:4px 7px; border-radius:5px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .tools .wide { grid-column:span 2; }
  @media (max-width:1150px) { .tools .wide { grid-column:auto; } }
  .kb { overflow-x:auto; }
  .cmd .d { width:170px; font-size:12.5px; }
  .cmd .d small { display:block; color:var(--mut); font-size:11px; }
  .kb { outline:none; padding:10px; border:2px dashed var(--line); border-radius:10px; user-select:none; }
  .kb:focus { border-color:var(--accent); }
  .kb .kr { display:flex; gap:4px; margin-bottom:4px; }
  .kb .k { flex:0 0 auto; width:34px; height:30px; border:1px solid #c9d1df; border-radius:5px; font-size:10px; display:flex; align-items:center; justify-content:center; background:#fff; color:#333; }
  .kb .k.hit { background:#bdf0cd; border-color:#16a34a; }
  .kb .k.kd { background:var(--accent); color:#fff; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:16px; padding:2px 9px; font-size:12px; cursor:pointer; user-select:none; }
  .chip.ok { background:#e3f6e9; border-color:#16a34a; color:#13803c; } .chip.bad { background:#fde8e8; border-color:var(--bad); color:var(--bad); } .chip.na { background:#eef1f6; color:#888; text-decoration:line-through; }
  .out { font:13px Consolas, monospace; background:#f3f5f9; border-radius:7px; padding:8px 10px; margin-top:8px; white-space:pre-wrap; }
  #screentest { position:fixed; inset:0; z-index:100; cursor:none; display:flex; align-items:flex-end; justify-content:center; }
  #screentest span { margin-bottom:20px; padding:4px 10px; border-radius:6px; background:rgba(0,0,0,.5); color:#fff; font-size:12px; cursor:default; }
  .tip { background:linear-gradient(90deg, var(--accent2), transparent); border:1px solid var(--line); border-radius:var(--r); padding:9px 14px; margin-bottom:14px; font-size:13px; }

function merge(a, b) {          // combine two copies of the data (e.g. office PC + home PC via Google Drive): newest edit of each record wins

  const cutoff = new Date(Date.now() - 180 * 864e5).toISOString();
  for (const k of Object.keys(del)) if (del[k] < cutoff) delete del[k];
  m.deleted = del;
  for (const c of COLLS) {
    const map = new Map();
    for (const r of [...b[c], ...a[c]]) { const o = map.get(r.id); if (!o || (r.upd || '') >= (o.upd || '')) map.set(r.id, r); }

  for (const [k, v] of Object.entries(a.custNotes || {})) if (!m.custNotes[k] || (v.upd || '') >= (m.custNotes[k].upd || '')) m.custNotes[k] = v;

  m.settings = { ...(useA ? a.settings : b.settings) }; m.settingsUpd = useA ? a.settingsUpd : b.settingsUpd;
  m.settings.nextTicket = Math.max(a.settings.nextTicket || 0, b.settings.nextTicket || 0, ...m.tickets.map(t => (t.no || 0) + 1));
  m.savedAt = (a.savedAt || '') > (b.savedAt || '') ? a.savedAt : b.savedAt;

  for (const src of [a, b]) for (const k of Object.keys(src || {})) if (!(k in m)) m[k] = src[k];

}
// The main data file never carries the leads: they live in their own file (_leads.json), which older app versions never open.
const LEADS_FILE = '_leads.json';

async function syncLeads(d, force) {
  if (!leadsDirty && !force) return;

async function getDir(root, path, create) { let d = root; for (const part of String(path || '').split(/[\\/]/).filter(Boolean)) d = await d.getDirectoryHandle(part, { create }); return d; }

const parseJSON = t => JSON.parse(t.replace(/^﻿/, ''));

async function flush() {
  if (!folder || !folderOK) { pending = false; setSync(folder ? 'reconnect' : 'local'); return; }
  if (busy) { clearTimeout(wt); wt = setTimeout(flush, 500); return; }

    const d = await getDir(folder, S().dataPath, true);

    await writeText(d, DATA_FILE, mainJSON(DB));
    await syncLeads(d);

    await weeklyBackup(d);

}
async function pullFromFolder() {           // read the Drive copy and merge it in (another computer may have changed it)

async function weeklyBackup(d) {               // checked once a day per device (remembered, so opening the app again doesn't re-list Backups)

const noPhone = s => { s = String(s).trim(); return /^[\d\s().+-]{7,}$/.test(s) ? '' : s; };   // invoices with only a phone number have no real name

// Find the invoice log even if a folder one level too high or too low was picked
// (e.g. "Invoice", "2026 Invoices", "Documents" or "My Drive" instead of "RCR").
async function findLog(root, p) {
  const parts = String(p).split(/[\\/]/).filter(Boolean), tries = [];
  for (let i = 0; i <= parts.length; i++) tries.push(parts.slice(i).join('/'));          // Invoice/2026 Invoices → 2026 Invoices → (picked folder itself)
  tries.push('RCR/' + p, 'Documents/RCR/' + p, 'My Drive/Documents/RCR/' + p);
  for (const t of tries) {
    try { const dir = await getDir(root, t, false); return { dir, fh: await dir.getFileHandle(LOG_FILE), path: t }; }
    catch (e) { if (e.name !== 'NotFoundError' && e.name !== 'TypeMismatchError') throw e; }
  }
  return null;
}
// The slimmed invoices are kept on this device together with the log's "last changed" time (invMod), so opening the app

      const f = await r.fh.getFile();

      texts.push([p, f]);

    if (name && k[0] === 'p' && !byName.has(name.toLowerCase().replace(/\s+/g, ' '))) byName.set(name.toLowerCase().replace(/\s+/g, ' '), k);

    if (t.email) c.email = t.email; if (t.addr && !c.addr) c.addr = t.addr; if (t.phone && !c.phone) c.phone = fmtPhone(t.phone);

  for (const c of map.values()) {

  return items.map(i => `<div class="hb" ${i.click ? `style="cursor:pointer" onclick="${i.click}"` : ''}><span title="${esc(i.l)}">${esc(i.l)}</span><div class="trk"><i style="width:${i.v / max * 100}%;background:${colorFn ? colorFn(i) : 'var(--accent)'}"></i></div><b>${fmt ? fmt(i.v, i) : i.v}</b></div>`).join('');
}

/* ============ follow-up engine ============ */
function readySince(t) { const h = [...(t.history || [])].reverse().find(x => x.s === 'ready'); return h ? h.t : t.updated || t.created; }
function followItems() {
  const out = [], td = today();
  for (const t of DB.tickets) {
    const dev = devName(t);
    if (t.status === 'ready') { const d = daysSince(readySince(t)); if (d >= 30) { out.push({ sev: 4, ic: '📬', grp: 'Unclaimed 30+ days — final notice', tx: `#${t.no} ${t.name} — ${dev}`, s: `Ready for ${plural(d, 'day')}${t.finalNotice ? ' · final notice sent ' + fmtTs(t.finalNotice) : ' · no final notice yet'}${t.lastReminder ? ' · last contact ' + fmtTs(t.lastReminder) : ''}`, ac: `<button class="btn sm" onclick="msgOpen('${t.id}','msgFinal')">💬 Final notice</button><button class="btn sm" onclick="pickupFlow('${t.id}')">📦 Pickup</button>` }); continue; }
      if (d >= 2) out.push({ sev: d >= S().staleDays ? 3 : 1, ic: '📦', grp: 'Ready but not picked up', tx: `#${t.no} ${t.name} — ${dev}`, s: `Ready for ${plural(d, 'day')}${t.lastReminder ? ' · last reminder ' + fmtTs(t.lastReminder) : ''}`, ac: `<button class="btn sm" onclick="msgOpen('${t.id}','msgReminder')">💬 Remind</button><button class="btn sm" onclick="remindedTicket('${t.id}')">Mark reminded</button><button class="btn sm" onclick="pickupFlow('${t.id}')">📦 Pickup</button>` }); }
    if (t.status === 'approval') { const d = daysSince((t.history || []).slice(-1)[0]?.t || t.created); if (d >= 1) out.push({ sev: 2, ic: '☎️', grp: 'Waiting on customer approval', tx: `#${t.no} ${t.name} — ${dev}`, s: `Waiting ${plural(d, 'day')} · estimate ${t.estimate ? money(t.estimate) : 'not set'} · ${esc(fmtPhone(t.phone))}`, ac: `<button class="btn sm" onclick="msgOpen('${t.id}','msgApproval')">💬 Ask approval</button><button class="btn sm" onclick="setStatus('${t.id}','repair')">Approved</button>` }); }
    if (OPEN.includes(t.status) && t.status !== 'ready' && t.due && t.due < td) out.push({ sev: 3, ic: '⏰', grp: 'Past promised date', tx: `#${t.no} ${t.name} — ${dev}`, s: `Promised ${fmtD(t.due)} (${plural(dayDiff(t.due, td), 'day')} late) · ${ST[t.status].l}`, ac: `<button class="btn sm" onclick="editTicket('${t.id}')">Open</button>` });
    if (t.status === 'done' && !t.invno && t.pickedUp && daysSince(t.pickedUp) <= 30) out.push({ sev: 2, ic: '🧾', grp: 'Picked up — no invoice yet', tx: `#${t.no} ${t.name} — ${dev}`, s: `Picked up ${fmtTs(t.pickedUp)}${t.estimate ? ' · estimate ' + money(t.estimate) : ''}`, ac: `<button class="btn sm" onclick="openInvoice('${t.id}')">🧾 Make invoice</button><button class="btn sm" onclick="editTicket('${t.id}')">Open</button>` });
    if (t.status === 'done' && !t.reviewAsked && t.pickedUp && daysSince(t.pickedUp) <= 21) out.push({ sev: 0, ic: '⭐', grp: 'Ask for a Google review', tx: `#${t.no} ${t.name} — ${dev}`, s: `Picked up ${fmtTs(t.pickedUp)}`, ac: `<button class="btn sm" onclick="msgOpen('${t.id}','msgReview')">💬 Ask for review</button><button class="btn sm" onclick="reviewAsked('${t.id}')">Mark asked</button>` });
  }
  for (const o of DB.orders) if (!['received', 'cancelled'].includes(o.status) && o.eta && o.eta < td) out.push({ sev: 2, ic: '🚚', grp: 'Parts orders past ETA', tx: `${o.part}${o.supplier ? ' from ' + o.supplier : ''}`, s: `ETA ${fmtD(o.eta)}${o.tracking ? ' · tracking ' + o.tracking : ''}${o.ticketId ? ' · ' + ticketRef(o.ticketId) : ''}`, ac: `<button class="btn sm" onclick="orderStatus('${o.id}','received')">Received</button><button class="btn sm" onclick="editOrder('${o.id}')">Edit</button>` });
  for (const e of INV) if (e.status === 'unpaid' && isRev(e)) { const d = Math.floor((Date.now() - e.t) / 864e5); if (d >= 3) out.push({ sev: d > 14 ? 3 : 2, ic: '💵', grp: 'Unpaid invoices', tx: `Invoice ${e.invno || '(no #)'} — ${e.name} — ${money(e.total)}`, s: `${e.date} · ${plural(d, 'day')} ago · ${e.job}`, ac: `${payBtn(e)} <button class="btn sm" onclick="invModal(${js(e.id)})">View</button>` }); }
  for (const p of DB.parts) if (num(p.qty) <= num(p.min) && !DB.orders.some(o => o.invId === p.id && !['received', 'cancelled'].includes(o.status))) out.push({ sev: 1, ic: '📉', grp: 'Low stock', tx: `${p.name}`, s: `${num(p.qty)} left (minimum ${num(p.min)})${p.supplier ? ' · ' + p.supplier : ''}`, ac: `<button class="btn sm" onclick="editOrder(null,{invId:'${p.id}',part:${js(p.name)},supplier:${js(p.supplier || '')},cost:${js(p.cost || '')},addToStock:true})">Order</button><button class="btn sm" onclick="ebaySearch(${js(partWords(p.name))})">🛒 eBay</button>` });
  for (const l of DB.leads || []) if (leadSt(l) === 'new' && leadAge(l) <= 7) { const p = digits(l.phone).slice(-10); out.push({ sev: 2, ic: '🎯', grp: 'New website leads', tx: `${l.name || l.email || fmtPhone(l.phone)}`, s: `Reached out ${leadAge(l) <= 0 ? 'today' : plural(leadAge(l), 'day') + ' ago'} · ${[fmtPhone(l.phone), l.email].filter(Boolean).join(' · ')}`, ac: `${p.length === 10 ? `<a class="btn sm" href="tel:${p}" onclick="leadTouch('${l.id}','Called')">📞 Call</a><a class="btn sm" href="sms:+1${p}?body=${encodeURIComponent(fillLead(S().msgLead, l))}" onclick="leadTouch('${l.id}','Texted')">💬 Text</a>` : ''}<button class="btn sm" onclick="go('leads')">Leads →</button>` }); }
  for (const q of DB.quotes || []) { const d = daysSince(q.sentAt || q.created); if (q.status === 'open' && d >= 3 && d <= 30) out.push({ sev: 1, ic: '💲', grp: 'Quotes not booked in yet', tx: `${q.name || fmtPhone(q.phone) || 'No name'} — ${quoteDev(q) || 'quote'} — ${money(q.total)}`, s: `Quoted ${plural(d, 'day')} ago${q.lastFollow ? ' · followed up ' + fmtTs(q.lastFollow) : ''}`, ac: `${digits(q.phone).length >= 10 ? `<button class="btn sm" onclick="quoteSend('${q.id}','text',true)">💬 Follow up</button>` : ''}<button class="btn sm" onclick="quoteModal('${q.id}')">Open</button><button class="btn sm" onclick="quoteStatus('${q.id}','lost')">Not interested</button>` }); }
  for (const a of DB.tasks) if (!a.done && a.due && a.due <= td) out.push({ sev: a.due < td ? 2 : 1, ic: '✅', grp: 'Tasks due', tx: a.text, s: a.due < td ? 'Due ' + fmtD(a.due) : 'Due today', ac: `<button class="btn sm" onclick="toggleTask('${a.id}')">Done</button>` });
  return out.sort((a, b) => b.sev - a.sev);
}

/* ============ tickets ============ */
const devName = t => [t.make, t.model].filter(Boolean).join(' ') || t.devType || 'device';
const ticketRef = id => { const t = DB.tickets.find(x => x.id === id); return t ? `ticket #${t.no} (${esc(t.name)})` : 'ticket'; };
function fillMsg(tpl, t) {

  const map = { first: first(t.name), name: t.name, device: devName(t), no: t.no, estimate: t.estimate ? money(t.estimate) : 'to be determined',
    total: t.estimate ? ` Your balance is ${money(total)}.` : '', diag: t.diag || '',

  return tpl.replace(/\{(\w+)\}/g, (m, k) => map[k] ?? m).replace(/\s+\./g, '.').replace(/ {2,}/g, ' ').trim();

/* ---- message panel: email / text / copy ---- */
const MSG_TYPES = [['msgReceived', 'Check-in receipt'], ['msgReady', 'Ready for pickup'], ['msgApproval', 'Ask for approval'], ['msgReminder', 'Pickup reminder'], ['msgFinal', 'Final pickup notice'], ['msgReview', 'Review request']];
const MSG_SUBJ = { msgReceived: 'We received your {device} — ticket #{no}', msgFinal: 'Final notice: please pick up your {device} (ticket #{no})', msgReady: 'Your {device} is ready for pickup — Rapid Computer Repair', msgApproval: 'Repair estimate for your {device} (ticket #{no})',
  msgReminder: 'Reminder: your {device} is ready for pickup', msgReview: 'Thank you from Rapid Computer Repair' };
let msgKind = 'msgReady';
const curTicket = () => { const f = $('#tf'); return f ? { ...tmp, ...formData(f) } : tmp; };   // includes edits not saved yet
const sig = () => `\n\nRapid Computer Repair\n${S().shopPhone}\n${S().shopWeb}`;
function msgOpen(id, k) { editTicket(id); showMsg(k); }
function showMsg(k) {
  const p = $('#msgpanel'); if (!p) return;
  k = k || (tmp.status === 'approval' ? 'msgApproval' : tmp.status === 'done' ? 'msgReview' : tmp.status === 'ready' ? (daysSince(readySince(tmp)) >= 30 ? 'msgFinal' : daysSince(readySince(tmp)) >= 2 ? 'msgReminder' : 'msgReady') : ['checkin', 'diag'].includes(tmp.status) ? 'msgReceived' : 'msgReady');
  msgKind = k; const t = curTicket(); p.hidden = false;
  $$('#msgseg button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  $('#msgsubj').value = fillMsg(MSG_SUBJ[k], t); $('#msgbody').value = fillMsg(S()[k], t);
  $('#msgto').innerHTML = [t.email ? '✉ ' + esc(t.email) : '<span class="down">No email on this ticket — add it in the Customer box</span>', t.phone ? '📱 ' + esc(fmtPhone(t.phone)) : ''].filter(Boolean).join(' · ');
  setTimeout(() => p.scrollIntoView({ behavior: 'smooth', block: 'center' }), 60);
}
function launch(href) { const a = document.createElement('a'); a.href = href; document.body.appendChild(a); a.click(); a.remove(); }
function sendMsg(how) {
  const t = curTicket(), body = $('#msgbody').value.trim(), subj = $('#msgsubj').value.trim();
  if (how === 'email') {
    if (!t.email) { toast("Add the customer's email in the Customer box first.", 'err'); $('#tf').email.focus(); return; }
    launch(`mailto:${encodeURIComponent(t.email)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body + sig())}`);
  } else if (how === 'text') {
    const d = digits(t.phone); if (d.length < 10) return toast("Add the customer's phone number first.", 'err');
    launch(`sms:+1${d.slice(-10)}?body=${encodeURIComponent(body)}`);
  } else copyText(body, 'Message');
  msgSent(t.id, msgKind, how);
}
function msgSent(id, k, how) {
  const t = DB.tickets.find(x => x.id === id); if (!t) return;          // ticket not checked in yet: nothing to note
  if (k === 'msgReminder') t.lastReminder = nowISO(); if (k === 'msgReview') t.reviewAsked = nowISO();
  if (k === 'msgFinal') t.lastReminder = t.finalNotice = nowISO(); if (k === 'msgReceived') t.receiptSent = nowISO();
  const note = { t: nowISO(), x: `"${MSG_TYPES.find(m => m[0] === k)[1]}" message ${how === 'email' ? 'emailed' : how === 'text' ? 'texted' : 'copied'}.` };
  (t.notes = t.notes || []).push(note);
  if (tmp && tmp.id === id) { (tmp.notes = tmp.notes || []).push(note); tmp.lastReminder = t.lastReminder; tmp.reviewAsked = t.reviewAsked; tmp.finalNotice = t.finalNotice; tmp.receiptSent = t.receiptSent; if ($('#tnotes')) drawNotes(); }
  upsert('tickets', t);

}
function msgTicket(id, which) { const t = DB.tickets.find(x => x.id === id); if (!t) return; copyText(fillMsg(S()[which], t), 'Message'); if (which === 'msgReminder') remindedTicket(id, true); if (which === 'msgReview') reviewAsked(id, true); }
function remindedTicket(id, quiet) { const t = DB.tickets.find(x => x.id === id); t.lastReminder = nowISO(); (t.notes = t.notes || []).push({ t: nowISO(), x: 'Pickup reminder sent.' }); upsert('tickets', t); if (!quiet) toast('Marked as reminded'); softRender(); }
function reviewAsked(id, quiet) { const t = DB.tickets.find(x => x.id === id); t.reviewAsked = nowISO(); upsert('tickets', t); if (!quiet) toast('Marked as asked'); softRender(); }
// "💵 Did they pay?" — asked whenever a ticket is moved to Picked Up outside the pickup checklist (ticket window's Status
// dropdown + Save, dragging a board card). go() carries on with the change; Cancel leaves the ticket as it was.
function paidCheck(id, go) {
  const t = DB.tickets.find(x => x.id === id) || (tmp && tmp.id === id ? tmp : null); if (!t) return go();
  const e = invoiceFor(t);
  if (e && (e.status === 'paid' || e.status === 'quote')) return go();
  const note = x => { const n = { t: nowISO(), x }; if (tmp && tmp.id === id && !$('#modal').hidden) (tmp.notes = tmp.notes || []).push(n); else { const d = DB.tickets.find(y => y.id === id); if (d) { (d.notes = d.notes || []).push(n); upsert('tickets', d); } } };
  const due = e ? money(e.total) : t.estimate ? money(num(t.estimate) - num(t.deposit)) : '';
  const ov = overlay(`<div class="ob pk"><div style="font-weight:700;font-size:17px">💵 Did they pay?</div>
    <div class="small muted" style="margin:2px 0 12px">#${t.no} ${esc(t.name)} — ${esc(devName(t))}</div>
    ${e ? `<div style="margin-bottom:8px"><span class="tag red">Unpaid · Invoice #${esc(e.invno)} · ${money(e.total)}</span></div>
      <div class="small muted" style="margin-bottom:6px">Yes — paid by:</div><div class="paygrid">${PAY_METHODS.map(m => `<button class="btn" data-pay="${esc(m)}">${esc(m)}</button>`).join('')}</div>`
    : `<div class="small muted" style="margin-bottom:8px">No invoice for this ticket yet${due ? ` · about ${due} due` : ''}.</div>
      <button class="btn pri" data-a="inv" style="width:100%;margin-bottom:6px">✓ Yes, they paid — make the invoice</button>`}
    <div class="row" style="margin-top:12px"><button class="btn" data-a="x">Cancel</button><span class="grow"></span><button class="btn" data-a="no">Not paid yet</button></div></div>`);
  ov.onclick = async ev => {
    const b = ev.target.closest('[data-a],[data-pay]'); if (ev.target === ov) { ov.remove(); render(); return; } if (!b) return;
    if (b.dataset.pay) {
      $$('button', ov).forEach(x => x.disabled = true);
      try { await setInvoicePay(e.id, { status: 'paid', paidDate: longDate(new Date()), paidMethod: b.dataset.pay, paidNote: '' }); }
      catch (err) { $$('button', ov).forEach(x => x.disabled = false); return toast('Could not mark it paid: ' + err.message, 'err'); }
      ov.remove(); note(`Picked up — paid (${b.dataset.pay}), invoice #${e.invno}.`); go(); toast(`Invoice ${e.invno} marked paid (${b.dataset.pay}).`, 'ok'); return;
    }
    const a = b.dataset.a; ov.remove();
    if (a === 'x') return render();                       // back as it was (resets a dragged card)
    if (a === 'no') { note(`Picked up — NOT paid yet${e ? ` (invoice #${e.invno}, ${money(e.total)})` : due ? ` (about ${due} due, no invoice yet)` : ' (no invoice yet)'}.`); go(); toast(`#${t.no} picked up — not paid yet. It stays on Follow-ups until it's paid.`); return; }
    if (a === 'inv') { note('Picked up — customer paid; invoice made from the ticket.'); go(); setTimeout(() => openInvoice(id), 300); }
  };
}
function setStatus(id, k, quiet) {

/* ---- ⏱ labor timer: t.timeLog = [{s, e}], t.timerStart while running; total goes to the invoice's Time field ---- */
const timeMins = t => Math.round((t.timeLog || []).reduce((s, x) => s + (Date.parse(x.e) - Date.parse(x.s)), 0) / 6e4 + (t.timerStart ? (Date.now() - Date.parse(t.timerStart)) / 6e4 : 0));
const fmtMins = m => m < 60 ? `${m} min` : `${Math.floor(m / 60)} hr${m >= 120 ? 's' : ''}${m % 60 ? ' ' + (m % 60) + ' min' : ''}`;
function drawTimer() {
  const el = $('#ttimer'); if (!el || !tmp) return; const m = timeMins(tmp), run = !!tmp.timerStart;
  el.innerHTML = `<span>⏱ Labor time: <b>${m || run ? fmtMins(m) : 'not started'}</b>${run ? ' <span class="tag timer">running</span>' : ''}</span>
    <button type="button" class="btn sm ${run ? '' : 'ok'}" onclick="timerToggle()">${run ? '⏸ Stop' : m ? '▶ Resume' : '▶ Start timer'}</button>${(tmp.timeLog || []).length && !run ? '<button type="button" class="btn sm" onclick="timerReset()">Reset</button>' : ''}`;
}
function timerSave() {           // the timer keeps going even if the ticket window is closed without saving
  const d = DB.tickets.find(x => x.id === tmp.id);
  if (d) { d.timeLog = JSON.parse(JSON.stringify(tmp.timeLog || [])); d.timerStart = tmp.timerStart || null; upsert('tickets', d); }
  drawTimer();
}
function timerToggle() {
  const now = nowISO();
  if (tmp.timerStart) { (tmp.timeLog = tmp.timeLog || []).push({ s: tmp.timerStart, e: now }); tmp.timerStart = null; toast(`Timer stopped — ${fmtMins(timeMins(tmp))} total.`); }
  else tmp.timerStart = now;
  timerSave();
}
function timerReset() { if (!confirm('Reset the labor time on this ticket to zero?')) return; tmp.timeLog = []; tmp.timerStart = null; timerSave(); }
setInterval(() => { if ($('#ttimer') && tmp && tmp.timerStart) drawTimer(); }, 30000);

function overlay(html, cls) {        // a layer above everything (even the ticket window); returns the element
  const ov = document.createElement('div'); ov.className = 'overlay ' + (cls || ''); ov.innerHTML = html;
  document.body.appendChild(ov); return ov;
}
function sheet(title, items) {       // bottom action sheet: items = [[label, fn, current?], …]
  const ov = overlay(`<div class="ob"><div style="font-weight:700;margin:2px 4px 8px">${title}</div>${items.map(([l, , cur], i) => `<button class="sb ${cur ? 'cur' : ''}" data-i="${i}">${l}</button>`).join('')}<button class="sb" data-i="x" style="text-align:center">Cancel</button></div>`, 'sheet');
  ov.onclick = e => { const b = e.target.closest('[data-i]'); if (e.target === ov || b) ov.remove(); if (b && b.dataset.i !== 'x') items[+b.dataset.i][1](); };

/* ---- 📦 Pickup checklist: payment, accessories back, tested with the customer, pickup signature → Picked Up ---- */
function pickupFlow(id) {
  const t = DB.tickets.find(x => x.id === id); if (!t) return;
  if (!$('#modal').hidden && tmp && tmp.id === id && modalDirty && !confirm('Save the changes on this ticket first?\n\nOK = save and continue · Cancel = go back')) return;
  if (!$('#modal').hidden && tmp && tmp.id === id && modalDirty) saveTicket();
  const st = { acc: {}, tested: false, sig: t.sigOut || null };
  const ov = overlay('<div class="ob pk"></div>');
  const draw = () => {
    const e = invoiceFor(t), acc = t.accessories || [];
    const pay = e ? (e.status === 'paid' ? `<span class="tag green">✓ Paid #${esc(e.invno)}</span> <span class="muted small">${esc(e.paidMethod || '')}</span>`
        : e.status === 'unpaid' ? `<div><span class="tag red">Unpaid #${esc(e.invno)} · ${money(e.total)}</span></div><div class="small muted" style="margin:6px 0 4px">Paid now by:</div><div class="paygrid">${PAY_METHODS.map(m => `<button class="btn sm" data-pay="${esc(m)}">${esc(m)}</button>`).join('')}</div>`
        : `<span class="tag">Invoice #${esc(e.invno)}</span>`)
      : `<div class="small muted" style="margin-bottom:6px">No invoice yet${t.estimate ? ` · estimate ${money(num(t.estimate) - num(t.deposit))} due` : ''}.</div><button class="btn sm pri" data-a="inv">🧾 Make invoice</button>`;
    const ok = { pay: !!e && e.status === 'paid', acc: acc.every(a => st.acc[a]), tested: st.tested, sig: !!st.sig };
    const step = (done, title, body) => `<div class="pk-step ${done ? 'ok' : ''}"><div class="pk-h"><span class="pk-c">${done ? '✓' : ''}</span>${title}</div><div class="pk-b">${body}</div></div>`;
    ov.querySelector('.pk').innerHTML = `<div style="font-weight:700;font-size:17px">📦 Pickup — #${t.no} ${esc(t.name)}</div><div class="small muted" style="margin:2px 0 12px">${esc(devName(t))}</div>
      ${step(ok.pay, '1. Payment', pay)}
      ${step(ok.acc, '2. Return what they left', acc.length ? `<div class="chk">${acc.map(a => `<label><input type="checkbox" data-acc="${esc(a)}" ${st.acc[a] ? 'checked' : ''}> ${esc(a)}</label>`).join('')}</div>` : '<span class="muted small">Nothing was left with the device.</span>')}
      ${step(ok.tested, '3. Show it working', `<label class="row small" style="gap:8px"><input type="checkbox" data-a="tested" ${st.tested ? 'checked' : ''}> Customer saw the device working${t.backup ? ' and their data is there' : ''}</label>`)}
      ${step(ok.sig, '4. Pickup signature', st.sig ? `<img src="${st.sig.d}" alt="" style="max-height:60px;background:#fff;border-radius:4px"> <button class="btn sm" data-a="sig">Sign again</button>` : '<button class="btn sm pri" data-a="sig">✍️ Customer signs</button>')}
      <div class="row" style="margin-top:14px"><button class="btn" data-a="x">Cancel</button><span class="grow"></span><button class="btn pri" data-a="done">${Object.values(ok).every(Boolean) ? '✓ Complete pickup' : 'Complete pickup anyway'}</button></div>`;
  };
  draw();
  ov.onchange = e => { const a = e.target.dataset.acc; if (a) st.acc[a] = e.target.checked; if (e.target.dataset.a === 'tested') st.tested = e.target.checked; draw(); };

// Barcode / QR scan with the camera (Chrome on Android, Chrome/Edge on computers). iPhone browsers can't read barcodes yet.
async function scanInto(input) {
  if (!('BarcodeDetector' in window) || !navigator.mediaDevices?.getUserMedia)
    return alert('This browser can\'t read barcodes yet (iPhones don\'t support it).\n\nOn an iPhone instead: tap the Serial box, tap it once more and choose "Scan Text" — point the camera at the label and tap Insert.');
  let det; try { const f = await BarcodeDetector.getSupportedFormats(); det = new BarcodeDetector(f.length ? { formats: f } : undefined); } catch (e) { return toast('Barcode reading is not available: ' + e.message, 'err'); }
  let stream; try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 } }, audio: false }); }
  catch (e) { return toast('The camera could not start: ' + e.message, 'err'); }
  const ov = overlay(`<video playsinline muted autoplay></video><div class="frame"></div><div class="bar"><span style="flex:1">Point at the barcode or QR code on the label</span><button class="btn">Cancel</button></div>`, 'scanner');
  const v = ov.querySelector('video'); v.srcObject = stream; v.play().catch(() => { });
  let done = false; const stop = () => { done = true; stream.getTracks().forEach(t => t.stop()); ov.remove(); };
  ov.querySelector('button').onclick = stop;
  const tick = async () => {
    if (done) return;
    try { const hit = (await det.detect(v)).find(x => (x.rawValue || '').trim());
      if (hit) { input.value = hit.rawValue.trim(); input.dispatchEvent(new Event('input', { bubbles: true })); if (navigator.vibrate) navigator.vibrate(80); stop(); modalDirty = true; toast('Scanned: ' + input.value); return; } } catch { }
    setTimeout(tick, 220);
  };
  v.addEventListener('loadeddata', tick, { once: true });
}

// Import a Wix contacts export (CSV). Only people not already listed, from the last 2 years, are added.
function parseCSV(t) {
  const out = []; let row = [], cur = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; row.push(cur); out.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur || row.length) { row.push(cur); out.push(row); }
  return out.filter(r => r.some(x => x.trim()));
}
async function leadImport(input) {
  const file = input.files[0]; input.value = ''; if (!file) return;
  const rows = parseCSV((await file.text()).replace(/^﻿/, '')); if (rows.length < 2) return toast('That file has no rows.', 'err');
  const h = rows[0].map(x => x.trim().toLowerCase()), col = rx => h.findIndex(x => rx.test(x));
  const iF = col(/first\s*name/), iL = col(/last\s*name/), iN = col(/^(full\s*)?name$/), iE = col(/e-?mail/), iP = col(/phone/), iD = col(/created|date added|creation|^date/);
  if (iE < 0 && iP < 0) return toast("Couldn't find email or phone columns in that file.", 'err');
  const have = new Set(); for (const l of DB.leads || []) { const p = digits(l.phone).slice(-10); if (p.length === 10) have.add('p' + p); if (l.email) have.add('e' + l.email.toLowerCase()); }
  const cutoff = addDays(today(), -730); let added = 0, dup = 0, old = 0;
  DB.leads = DB.leads || [];
  for (const r of rows.slice(1)) {
    const email = (iE >= 0 ? r[iE] : '').trim().toLowerCase(), phone = digits(iP >= 0 ? r[iP] : '').slice(-10);
    if (!email && phone.length < 10) continue;
    if ((phone.length === 10 && have.has('p' + phone)) || (email && have.has('e' + email))) { dup++; continue; }
    const dt = iD >= 0 ? new Date(r[iD]) : new Date(), created = isNaN(dt) ? today() : dt.toISOString().slice(0, 10);
    if (created < cutoff) { old++; continue; }
    const name = (iN >= 0 ? r[iN] : [iF >= 0 ? r[iF] : '', iL >= 0 ? r[iL] : ''].join(' ')).replace(/\s+/g, ' ').trim();
    const l = { id: uid(), name, email, phone: phone.length === 10 ? phone : '', created, status: LEAD_SPAM.test(email + ' ' + name) ? 'spam' : 'new', notes: '', src: 'Wix CSV ' + today(), upd: nowISO() };
    DB.leads.push(l); if (l.phone) have.add('p' + l.phone); if (email) have.add('e' + email); added++;
  }
  leadsDirty = true; commit(); render();
  toast(`Imported ${plural(added, 'new lead')}${dup ? ` · ${dup} already listed` : ''}${old ? ` · ${old} older than 2 years skipped` : ''}.`);
}

// Same for several invoices at once (PayPal import): one read and one write per log file. Returns the old values in the same order.
async function setInvoicesPay(changes) {
  if (!folder || !folderOK) throw new Error('the RCR folder is not connected');
  const befores = new Array(changes.length), left = new Set(changes.map((c, i) => i));
  for (const p of S().logPaths) {
    if (!left.size) break;
    const r = await findLog(folder, p); if (!r) continue;
    const log = parseJSON(await (await r.fh.getFile()).text());
    if (!Array.isArray(log)) continue;
    const byId = new Map(log.map(x => [slim(x).id, x])); let n = 0;
    for (const i of [...left]) {
      const e = byId.get(changes[i].id); if (!e) continue;
      // the old values exactly as they were (a missing field stays missing after Undo, so "payment not tracked" stays that way)
      const raw = o => ({ status: o.status, paidDate: o.paidDate, paidMethod: o.paidMethod, paidNote: o.paidNote });
      befores[i] = { restore: true, top: raw(e), data: e.data ? raw(e.data) : null };
      const pay = changes[i].pay;
      if (pay.restore) { Object.assign(e, pay.top); if (e.data && pay.data) Object.assign(e.data, pay.data); }
      else { Object.assign(e, pay); if (e.data) Object.assign(e.data, pay); }
      left.delete(i); n++;
    }
    if (!n) continue;
    const text = JSON.stringify(log, null, 1);
    if (!Array.isArray(JSON.parse(text)) || JSON.parse(text).length !== log.length) throw new Error('safety check failed, nothing was written');
    await writeText(r.dir, LOG_FILE, text);
    invMod[p] = (await r.fh.getFile()).lastModified;
  }
  if (left.size) throw new Error(left.size === changes.length ? 'that invoice was not found in the invoice log' : `${left.size} of the invoices were not found in the invoice log (the others were saved)`);
  for (const c of changes) {
    const s = INV.find(x => x.id === c.id); if (!s) continue;
    const p = c.pay.restore ? { ...(c.pay.data || {}), ...Object.fromEntries(Object.entries(c.pay.top).filter(([, v]) => v !== undefined)) } : c.pay;
    Object.assign(s, { status: p.status ?? '', paidDate: p.paidDate || '', paidMethod: p.paidMethod || '', pnote: p.paidNote || '' });
  }
  custCache = null; saveInvCache();
  render();

}

async function ppFile(input) {

// PayPal CSV → payments received. Headers are matched loosely (PayPal changes them now and then).

  // in Zettle (paired with a "Cash Transfer" memo), "Express Checkout Payment" Credit = a PayPal invoice paid online, "Subscription Payment" =
  // monthly care plans (not invoices). "Invoice Number" / "for invoice 1542" are PAYPAL's own invoice numbers — they collide with the shop's

const CARD_FEE = 0.03;     // the shop adds 3% when a customer pays by card (seen in the PayPal file: $103 paid on a $100 invoice)
const ppWords = s => String(s || '').toLowerCase().replace(/[^a-z\s]/g, ' ').split(/\s+/).filter(w => w.length > 1);
// How well a payment fits an invoice: amount, invoice # in the note, name, email, phone, and the payment date vs the invoice date.

    if (hit.length >= 2 || (hit.length && hit.length === ew.length)) { s += 40; why.push('name'); }
    else if (hit.length && ew[ew.length - 1] === hit[hit.length - 1]) { s += 25; why.push('last name'); }
    else if (hit.length) { s += 12; why.push('first name'); }

  if (p.phone.length === 10 && digits(e.phone).replace(/^1(?=\d{10}$)/, '') === p.phone) { s += 45; why.push('phone'); }

function ppMatch() {

  const open = INV.filter(e => canPay(e) && e.total > 0);

    const done = p.txn && recorded.get(p.txn.toUpperCase());
    if (done) return { p, done };
    const cands = open.map(e => ({ e, ...ppScore(p, e, custOf(e)) })).filter(x => x.same ? x.s >= 40 : x.s >= 50).sort((a, b) => b.s - a.s).slice(0, 12);

// Same rule as the Invoice Form: highest number of the last ~4 months + 1 (so an old typo can't push the count way up), skipping any number already used.
function nextInvNo(log) {
  const nums = log.map(e => ({ n: parseInt(e.invno, 10) || 0, t: Date.parse(e.date) || Date.parse(e.savedAt) || 0 })).filter(x => x.n);
  const recent = nums.filter(x => x.t >= Date.now() - 120 * 864e5).map(x => x.n);
  let n = Math.max(2110, ...(recent.length ? recent : nums.map(x => x.n))) + 1;
  const used = new Set(log.map(e => String(e.invno)));
  while (used.has(String(n))) n++;
  return n;
}

  if (!confirm('Remove this quick sale from the invoice log?')) return;
  try {
    const r = await findLog(folder, S().logPaths[0]); if (!r) throw new Error('invoice log not found');
    const log = parseJSON(await (await r.fh.getFile()).text()); if (!Array.isArray(log)) throw new Error('the invoice log could not be read');
    const i = log.findIndex(x => x.id === id && x.kind === 'Quick Sale'); if (i < 0) throw new Error('that sale is no longer in the log (or was changed in the Invoice Form)');

    await writeText(r.dir, LOG_FILE, text);

/* ============ 💲 QUOTES: prices from the owner's price sheet (RCR/RCR Pricing Sheet.xlsx, "Pricing" tab) ============
   Parts: landed cost (part + shipping + tax) → markup tier → rounded UP to the whole dollar (the sheet's own examples: 68 → 96, 1277.34 → 1469).
   Labor: one fixed charge per job type. Bench fee, own-part handling and the special-order deposit come from the same tab.
   The sheet is only read, never written; the last good read is kept in localStorage so quotes work instantly and offline. */
const PRICE_DEF = { src: 'built-in', file: '', bench: 49, handling: 25, depOver: 150, depPct: 50, rules: [],
  tiers: [{ lo: 0, hi: 50, add: 25, mult: 1, min: 0, l: 'Under $50', r: 'Cost + $25' }, { lo: 50, hi: 150, add: 0, mult: 1.4, min: 0, l: '$50 to $150', r: 'Cost × 1.40' },
    { lo: 150, hi: 400, add: 0, mult: 1.25, min: 0, l: '$150 to $400', r: 'Cost × 1.25' }, { lo: 400, hi: null, add: 0, mult: 1.15, min: 75, l: 'Over $400', r: 'Cost × 1.15 (at least $75 profit)' }],
  labor: [{ job: 'Quick fix', time: '30 min or less', price: 60, ex: 'Software, settings, sign-in issues' }, { job: 'Simple install', time: 'About 1 hr', price: 95, ex: 'RAM, SSD, battery, fan, thermal paste' },
    { job: 'Screen and body', time: '1 to 1.5 hr', price: 120, ex: 'Screen, keyboard, palmrest, top cover' }, { job: 'Full teardown', time: '2 hr or more', price: 160, ex: 'Motherboard, DC jack, hinge' },
    { job: 'Data and OS', time: 'Varies', price: 135, ex: 'OS reinstall with data transfer, data recovery (starting price)' }, { job: 'Custom PC build', time: '3 to 4 hr', price: 250, ex: 'Assembly, setup and testing' },
    { job: 'House call / on-site', time: 'Per hour, 1 hr minimum', price: 125, ex: 'Plus travel fee outside your service area' }, { job: 'Business remote support', time: 'Per hour, 15-min blocks', price: 100, ex: 'Remote help for business clients' }] };
let pricingCache = null, pricingBusy = false, pricingChecked = 0;
function PRICING() {
  if (!pricingCache) { try { pricingCache = JSON.parse(localStorage.getItem('rcr-pricing') || 'null'); } catch { } }
  return (pricingCache && pricingCache.P) || PRICE_DEF;
}
function parsePricing(sheets) {
  const rows = sheets.Pricing || Object.values(sheets)[0] || [], cell = (r, i) => String((r || [])[i] ?? '').trim();
  const P = { tiers: [], labor: [], rules: [], bench: 0, handling: 0, depOver: 0, depPct: 0 }; let mode = '';
  for (const r of rows) {
    if (!r) continue;
    const a = cell(r, 0), b = cell(r, 1); if (!a) continue;
    if (/^landed cost$/i.test(a) && /^charge$/i.test(b)) { mode = 'tiers'; continue; }
    if (/^job type$/i.test(a)) { mode = 'labor'; continue; }
    if (/^rules$/i.test(a)) { mode = 'rules'; continue; }
    if (/^(parts markup|labor rates)$/i.test(a)) { mode = ''; continue; }
    if (mode === 'tiers') {
      const n = (a.match(/\d[\d,]*(\.\d+)?/g) || []).map(num); let lo = 0, hi = null;
      if (/under|less|below/i.test(a)) hi = n[0]; else if (/over|above|more/i.test(a)) lo = n[0]; else if (n.length >= 2) { lo = n[0]; hi = n[1]; } else continue;
      const add = (b.match(/\+\s*\$?\s*([\d.]+)/) || [])[1], mult = (b.match(/[×x*]\s*([\d.]+)/i) || [])[1], min = (b.match(/at least\s*\$?\s*([\d.]+)/i) || [])[1];
      if (!add && !mult) continue;
      P.tiers.push({ lo, hi, add: num(add), mult: mult ? num(mult) : 1, min: num(min), l: a, r: b });
    } else if (mode === 'labor') {
      const price = num(r[2]); if (!price) continue;
      if (/bench/i.test(a)) { P.bench = price; continue; }
      P.labor.push({ job: a, time: cell(r, 1), price, ex: cell(r, 3) });
    } else if (mode === 'rules') {
      if (/yellow cell|blue numbers/i.test(a)) continue;
      P.rules.push(a);
      const h = a.match(/own part.*?\$\s*([\d.]+)\s*handling/i); if (h) P.handling = num(h[1]);
      const d = a.match(/over\s*\$\s*([\d,.]+).*?(\d+)\s*%\s*deposit/i); if (d) { P.depOver = num(d[1]); P.depPct = num(d[2]); }
    }
  }
  if (!P.tiers.length || !P.labor.length) return null;
  P.tiers.sort((x, y) => x.lo - y.lo); return P;
}
// Re-reads the price sheet only when the file changed (checked at most once a minute unless forced).
async function loadPricing(force) {
  if (!folder || !folderOK || pricingBusy || (!force && Date.now() - pricingChecked < 60e3)) return;
  pricingBusy = true; pricingChecked = Date.now();
  try {
    const parts = String(S().priceSheet || DEF.priceSheet).split(/[\\/]/).filter(Boolean), name = parts.pop();
    const f = await (await (await getDir(folder, parts.join('/'), false)).getFileHandle(name)).getFile();
    PRICING(); if (!force && pricingCache && pricingCache.mod === f.lastModified && pricingCache.file === name) return;
    const P = parsePricing(await readXlsx(await f.arrayBuffer()));
    if (!P) throw new Error(`"${name}" has no markup or labor table on its Pricing tab.`);
    P.src = 'sheet'; P.file = name;
    pricingCache = { P, mod: f.lastModified, file: name, at: nowISO() };
    try { localStorage.setItem('rcr-pricing', JSON.stringify(pricingCache)); } catch { }
    if (force) toast('Price sheet loaded.');
    if ($('#qf')) qDraw();
  } catch (e) { if (force || !pricingCache) toast("Couldn't read the price sheet: " + (e.name === 'NotFoundError' ? `"${S().priceSheet}" not found in the RCR folder (check Settings)` : e.message) + '. Using the last known rates.', 'err'); }
  finally { pricingBusy = false; }
}
function partCharge(cost, P = PRICING()) {
  cost = num(cost); if (cost <= 0) return 0;
  const t = P.tiers.find(t => cost >= t.lo && (t.hi == null || cost < t.hi)) || P.tiers[P.tiers.length - 1];
  let c = cost * t.mult + t.add; if (t.min && c - cost < t.min) c = cost + t.min;
  return Math.ceil(c - 1e-9);
}
const quoteDev = q => [q.make, q.model].filter(Boolean).join(' ');
const qLabel = l => l.kind === 'labor' ? String(l.desc).replace(/^labor\s*[–-]\s*/i, '') + ' (labor)' : String(l.desc).replace(/^part\s*[–-]\s*/i, '');
function quoteText(q) {
  const P = PRICING(), dev = quoteDev(q);
  const map = { first: first(q.name), name: q.name || '', forDevice: dev ? ` for your ${dev}` : '', shopPhone: S().shopPhone, total: money(q.total || 0),
    lines: q.lines.map(l => `• ${qLabel(l)}: ${money(num(l.price))}`).join('\n') + (q.ownPart ? '\n• You supply the part (no warranty on the part itself)' : ''),
    depositLine: q.deposit ? `\nDeposit to order the part: ${money(q.deposit)}` : '',
    benchLine: P.bench ? `Quotes are free. If you decide not to go ahead after we open the device, there's a ${money0(P.bench)} bench fee.\n` : '' };
  return (S().msgQuote || DEF.msgQuote).replace(/\{(\w+)\}/g, (m, k) => map[k] ?? m);

    if (grp) { try { await RCRDrive.people(grp + '?maxMembers=0'); } catch (e) { if (e.status !== 404) throw e; grp = ''; } }
    if (!grp) { grp = (await RCRDrive.people('contactGroups', 'POST', { contactGroup: { name: 'RCR Customers' } })).resourceName; saveSettings({ gcontGroup: grp }); }
    // 2. every contact in the account: ours (by clientData) and the owner's own numbers
    const ours = new Map(), theirs = new Set(); let tok = '';
    do {
      const r = await RCRDrive.people('people/me/connections?personFields=phoneNumbers,clientData,metadata&pageSize=1000' + (tok ? '&pageToken=' + encodeURIComponent(tok) : ''));
      for (const p of r.connections || []) {
        const cd = Object.fromEntries((p.clientData || []).map(x => [x.key, x.value]));
        if (cd.rcr) { if (ours.has(cd.rcr)) ours.get(cd.rcr).dupes.push(p.resourceName); else ours.set(cd.rcr, { rn: p.resourceName, etag: p.etag, sig: cd.rcrsig || '', dupes: [] }); }
        else for (const n of p.phoneNumbers || []) { const d = p10(n.value); if (d.length === 10) theirs.add(d); }
      }
      tok = r.nextPageToken || '';
    } while (tok);
    // 3. the customers that should be there: everyone with a 10-digit number, one contact per number
    const want = new Map(), seen = new Set();
    for (const c of customers()) { const d = p10(c.phone); if (d.length !== 10 || seen.has(d)) continue; seen.add(d); want.set(c.key, c); }
    st.total = want.size;
    const toCreate = [], toUpdate = [];
    for (const [k, c] of want) {
      const o = ours.get(k), P = contPerson(c, o ? null : grp), sig = P._sig; delete P._sig;
      if (!o) { if (theirs.has(p10(c.phone))) { st.skipped++; continue; } toCreate.push(P); }
      else if (o.sig !== sig) toUpdate.push([o.rn, { ...P, etag: o.etag }]);
    }
    const toDelete = [...ours].filter(([k]) => !want.has(k)).map(([, o]) => o.rn).concat([...ours.values()].flatMap(o => o.dupes));
    // 4. send the changes in batches (one at a time — Google asks for that)
    for (let i = 0; i < toCreate.length; i += 200) {
      const part = toCreate.slice(i, i + 200);
      await RCRDrive.people('people:batchCreateContacts', 'POST', { contacts: part.map(p => ({ contactPerson: p })), readMask: 'clientData' }); st.created += part.length;
    }
    for (let i = 0; i < toUpdate.length; i += 200) {
      const part = toUpdate.slice(i, i + 200);
      try { await RCRDrive.people('people:batchUpdateContacts', 'POST', { contacts: Object.fromEntries(part), updateMask: 'names,phoneNumbers,emailAddresses,biographies,clientData', readMask: 'clientData' }); st.updated += part.length; }
      catch (e) { if (e.status !== 400 && e.status !== 409) throw e; PC.again = true; }    // changed on another device a moment ago: list again and retry
    }
    for (let i = 0; i < toDelete.length; i += 500) {
      const part = toDelete.slice(i, i + 500);
      await RCRDrive.people('people:batchDeleteContacts', 'POST', { resourceNames: part }); st.deleted += part.length;
    }
    PC.t = Date.now(); PC.err = ''; PC.stats = { ...st };
    localStorage.setItem('rcr-gcont-at', JSON.stringify({ t: PC.t, ...st }));
    if (loud) toast(st.created || st.updated || st.deleted ? `📇 Caller ID: ${[st.created && st.created + ' added', st.updated && st.updated + ' updated', st.deleted && st.deleted + ' removed'].filter(Boolean).join(', ')}.` : '📇 Caller ID contacts are up to date.', 'ok');
  } catch (e) {
    PC.err = e.message;
    if (e.name === 'AuthError') { folderOK = false; setSync('reconnect'); }
    else if (e.name === 'ContactsDenied') { if (/scope|permission/i.test(e.message) && !/disabled|not been used/i.test(e.message)) localStorage.removeItem('rcr-gscope'); if (loud) contSetup(e.message); }
    else if (loud) toast(e.message, 'err');
    console.warn('contacts sync:', e);
  } finally {
    PC.busy = false;
    if (PC.again) { PC.again = false; setTimeout(contSync, 1500); }
    if (view === 'customers' || view === 'settings') softRender();
  }
}
// Removes every contact this app made (and its group). The owner's own contacts are never touched.
async function contRemoveAll() {

  if (m[3]) { const mk = ip2n(m[3]), inv = (~mk >>> 0) + 1; cidr = 32 - Math.log2(inv); if (!Number.isInteger(cidr)) { el.textContent = 'That subnet mask is not valid.'; return; } }
  if (cidr > 32) { el.textContent = 'Prefix must be 0–32.'; return; }

  if (tk.length) h += '<div class="h">Tickets</div>' + tk.map(t => `<div class="it" onmousedown="editTicket('${t.id}')"><b>#${t.no}</b> ${esc(t.name)} — ${esc(devName(t))} ${badge(t.status)}</div>`).join('');
  if (cs.length) h += '<div class="h">Customers</div>' + cs.map(c => `<div class="it" onmousedown="custModal(${js(c.key)})">${esc(c.name)} <small>${esc(c.phone)} · ${plural(c.visits, 'visit')}</small></div>`).join('');
  if (iv.length) h += '<div class="h">Invoices</div>' + iv.map(e => `<div class="it" onmousedown="invModal(${js(e.id)})"><b>${esc(e.invno || '—')}</b> ${esc(nameFor(e))} <small>${esc(e.date)} · ${esc(e.job)} · ${money(e.total)}</small></div>`).join('');
  if (pt.length) h += '<div class="h">Parts</div>' + pt.map(p => `<div class="it" onmousedown="editPart('${p.id}')">${esc(p.name)} <small>${num(p.qty)} in stock</small></div>`).join('');
  box.innerHTML = h || '<div class="it muted">No matches</div>'; box.hidden = false; gsel = 0; markSel();
}
function markSel() { $$('#gres .it').forEach((el, i) => el.classList.toggle('sel', i === gsel)); }
function gkey(e) {
  const items = $$('#gres .it'); if ($('#gres').hidden || !items.length) return;
  if (e.key === 'ArrowDown') { gsel = Math.min(items.length - 1, gsel + 1); markSel(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { gsel = Math.max(0, gsel - 1); markSel(); e.preventDefault(); }
  else if (e.key === 'Enter') { items[gsel].dispatchEvent(new MouseEvent('mousedown')); $('#gres').hidden = true; e.target.blur(); }
}

/* ============ keyboard + startup ============ */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { $('#gres').hidden = true; if (!$('#modal').hidden) closeModal(); return; }
  const tag = document.activeElement?.tagName || '';
  if (/INPUT|TEXTAREA|SELECT/.test(tag) || e.ctrlKey || e.metaKey || e.altKey || !$('#modal').hidden) return;
  konami(e); if (kPos > 0 && !/^[nNiIqQpP/0-9]$/.test(e.key)) return;
  if (e.key === 'p' || e.key === 'P') { e.preventDefault(); return quoteModal(); }
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); editTicket(); }
  else if (e.key === 'i' || e.key === 'I') { e.preventDefault(); openInvoice(); }
  else if (e.key === 'q' || e.key === 'Q') { e.preventDefault(); quickSale(); }
  else if (e.key === '/') { e.preventDefault(); $('#gq').focus(); }
  else if (/^[0-9]$/.test(e.key)) go(Object.keys(VIEWS)[(+e.key || 10) - 1]);
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  // web app reopened after the 1-hour Google sign-in ran out: renew it quietly (not while a ticket/window is open)
  if (HOSTED && !RCRDrive.signedIn() && RCRDrive.wasSignedIn()) { if ($('#modal').hidden) RCRDrive.signIn({ silent: true }); return; }
  if (folderOK && !pending) pullFromFolder();
});
window.addEventListener('beforeunload', e => { if (HOSTED && !RCRDrive.signedIn()) return; if (pending && folderOK) { flush(); e.preventDefault(); e.returnValue = ''; } });
setInterval(() => { if (document.visibilityState === 'visible' && folderOK && !pending) pullFromFolder(); }, 120000);

window.addEventListener('DOMContentLoaded', async function start() {
  $('#logo').src = LOGO; $('#favicon').href = LOGO; setTheme(localStorage.getItem('rcr-theme') || '');
  if (TOUCH()) $('#gq').placeholder = 'Search tickets, customers, invoices…';   // no "( / )" keyboard hint on phones
  tabHold();
  setSync('local'); render();
  try {
    const cached = await idb.get('inv'); if (cached && cached.INV) { INV = cached.INV; invInfo = cached.invInfo || invInfo; invMod = { ...(cached.invMod || {}) }; custCache = null; render(); }
    if (HOSTED) return void await driveConnect(true);
    const h = await idb.get('folder');
    if (h) { folder = h; if (await h.queryPermission({ mode: 'readwrite' }) === 'granted') { folderOK = true; await pullFromFolder(); await loadInvoices(true); } else setSync('reconnect'); render(); }
  } catch (e) { console.error(e); }
});
</script>
