<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RCR Shop</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#121a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RCR Shop">
<meta name="robots" content="noindex">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font: 16px/1.45 "Segoe UI", system-ui, -apple-system, Arial, sans-serif; color: #e9edf5; background: #121a2b;
         display: flex; align-items: center; justify-content: center; padding: 24px 18px calc(24px + env(safe-area-inset-bottom)); }
  .card { width: 100%; max-width: 420px; text-align: center; }
  .logo { width: 108px; height: 108px; border-radius: 22px; background: #fff; padding: 6px; }
  h1 { font-size: 22px; margin: 14px 0 2px; }
  .sub { color: #8f9ab0; font-size: 14px; margin-bottom: 26px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 16px; margin: 10px 0; border: 0; border-radius: 14px;
         font: 600 17px/1 inherit; text-decoration: none; cursor: pointer; color: #fff; background: #1d5fd1; }
  .btn.alt { background: #26314a; }
  .btn.g { background: #fff; color: #222; }
  .btn.g img { width: 20px; height: 20px; }
  .who { font-size: 13px; color: #8f9ab0; margin-top: 18px; }
  .who a { color: #9fb7e8; }
  .msg { background: #3a2d12; color: #f6d98b; border-radius: 12px; padding: 12px 14px; font-size: 14px; text-align: left; margin: 14px 0; }
  .tip { font-size: 13px; color: #8f9ab0; margin-top: 22px; text-align: left; background: #1a2338; border-radius: 12px; padding: 12px 14px; }
  .tip b { color: #cfd6e4; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="icons/icon-512.png" alt="Rapid Computer Repair">
  <h1>Rapid Computer Repair</h1>
  <div class="sub">Shop dashboard &amp; invoices</div>
  <div id="msg" class="msg" hidden></div>
  <div id="busy" hidden>Signing in…</div>
  <div id="out" hidden>
    <button class="btn g" onclick="goGoogle(false, 'dashboard/')"><img alt="" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><path fill='%23FFC107' d='M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z'/><path fill='%23FF3D00' d='M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z'/><path fill='%234CAF50' d='M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z'/><path fill='%231976D2' d='M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z'/></svg>">Sign in with Google</button>
    <div class="who">Only your Google account can see your shop data. It stays in your Google Drive (Documents › RCR).</div>
  </div>
  <div id="in" hidden>
    <a class="btn" href="dashboard/">🛠️ Dashboard</a>
    <a class="btn alt" href="invoice/">🧾 Invoice Form</a>
    <div class="who">Signed in as <b id="email"></b> · <a href="#" onclick="signOut();return false">Sign out</a></div>
  </div>
  <div id="install" class="tip" hidden></div>
  <div class="who"><a href="privacy.html">Privacy policy</a></div>
</div>
<script>
/* Google sign-in for the RCR web app.
   The apps (dashboard/, invoice/) send the user here with ?signin=1&ret=<page> when they need a Google token.
   This page sends the user to Google, Google sends them back here with #access_token=…, and this page stores it
   (localStorage "rcr-gtoken", valid 1 hour) and returns to <page>. ?silent=1 tries without showing anything first. */
const CLIENT_ID = '561861377412-gpe07bt2tp6djrcokgrsvihoirsb4ii0.apps.googleusercontent.com';   // Google OAuth client ID (Google Cloud project "My First Project", client "RCR Shop web")
const SCOPE = 'https://www.googleapis.com/auth/drive';      // read/write the shop files in Google Drive
const GSCOPE = 'https://www.googleapis.com/auth/gmail.readonly';   // optional: read Amazon / eBay order emails ("Check Gmail"); only asked for after the user turns it on
const wantGmail = () => localStorage.getItem('rcr-gmail') === '1';
// Optional extras, each asked for only after the user turns it on in the dashboard (?gmail=1 / ?cal=1).
// key: [URL flag, localStorage flag, scope]
const EXTRAS = { gmail: ['gmail', 'rcr-gmail', GSCOPE],
  cal: ['cal', 'rcr-gcal', 'https://www.googleapis.com/auth/calendar.app.created'],     // iPhone calendar: only the "RCR Appointments" calendar this app makes
  cont: ['cont', 'rcr-gcont', 'https://www.googleapis.com/auth/contacts'] };            // caller ID: customers as contacts (the app only changes contacts it made itself)
const wanted = () => Object.values(EXTRAS).filter(([, f]) => localStorage.getItem(f) === '1');
const BASE = location.pathname.replace(/index\.html$/, '');
const HERE = location.origin + BASE;
const $ = s => document.querySelector(s);
const user = () => { try { return JSON.parse(localStorage.getItem('rcr-guser') || 'null'); } catch { return null; } };
const tokenOK = () => { try { const t = JSON.parse(localStorage.getItem('rcr-gtoken') || 'null'); return t && t.exp > Date.now() + 60e3; } catch { return false; } };
// Only return to a page of this web app (never to another site).
const safeRet = r => (r && r.startsWith(BASE) && !r.startsWith('//') && !/[\\\s]/.test(r)) ? r : BASE + 'dashboard/';
function show(id) { ['out', 'in', 'busy'].forEach(x => $('#' + x).hidden = x !== id); }
function msg(t) { $('#msg').hidden = !t; $('#msg').textContent = t || ''; }

function goGoogle(silent, ret) {
  if (!CLIENT_ID) { msg('Setup is not finished: the Google sign-in key (client ID) has not been added to this page yet.'); show('out'); return; }
  const u = user(), p = new URLSearchParams({ client_id: CLIENT_ID, redirect_uri: HERE, response_type: 'token', scope: [SCOPE, ...wanted().map(x => x[2])].join(' '),
    include_granted_scopes: 'true', state: safeRet(ret.startsWith(BASE) ? ret : BASE + ret) });
  if (silent) p.set('prompt', 'none'); else if (!u) p.set('prompt', 'select_account');
  if (u && u.email) p.set('login_hint', u.email);
  show('busy');
  location.replace('https://accounts.google.com/o/oauth2/v2/auth?' + p);
}
function signOut() {
  const t = (() => { try { return JSON.parse(localStorage.getItem('rcr-gtoken') || 'null'); } catch { return null; } })();
  if (t && t.token) fetch('https://oauth2.googleapis.com/revoke?token=' + encodeURIComponent(t.token), { method: 'POST' }).catch(() => {});
  ['rcr-gtoken', 'rcr-guser', 'rcr-drive-root', 'rcr-gmail', 'rcr-gcal', 'rcr-gcont', 'rcr-gscope'].forEach(k => localStorage.removeItem(k));
  start();
}

async function start() {
  const h = new URLSearchParams(location.hash.slice(1)), q = new URLSearchParams(location.search);
  if (h.get('access_token')) {                               // back from Google with a token
    history.replaceState(null, '', BASE);
    show('busy');
    const tok = h.get('access_token');
    localStorage.setItem('rcr-gtoken', JSON.stringify({ token: tok, exp: Date.now() + (+h.get('expires_in') || 3600) * 1000 }));
    localStorage.setItem('rcr-gscope', h.get('scope') || SCOPE);
    // Gmail box left unticked: stop asking for it (otherwise every quiet hourly sign-in would need a tap)
    for (const [k, f, sc] of wanted()) if (!(h.get('scope') || '').includes(sc)) { localStorage.removeItem(f); localStorage.setItem(f + '-note', 'no'); }
    if (!(h.get('scope') || SCOPE).includes(SCOPE)) { msg('Google sign-in worked, but access to Google Drive was not allowed. Sign in again and tick the Google Drive box.'); show('out'); return; }
    try {
      const r = await fetch('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress,displayName)', { headers: { Authorization: 'Bearer ' + tok } });
      const j = await r.json(); if (j.user) localStorage.setItem('rcr-guser', JSON.stringify({ email: j.user.emailAddress, name: j.user.displayName }));
    } catch { }
    location.replace(safeRet(h.get('state')));
    return;
  }
  if (h.get('error')) {                                      // Google said no
    history.replaceState(null, '', BASE);
    const e = h.get('error');
    const had = localStorage.getItem('rcr-gscope') || '', newly = wanted().filter(x => !had.includes(x[2]));
    if (e === 'access_denied' && newly.length) { newly.forEach(x => localStorage.removeItem(x[1])); if (user()) return location.replace(safeRet(h.get('state'))); }
    if (/interaction_required|login_required|consent_required|account_selection_required/.test(e)) return goGoogle(false, h.get('state') || 'dashboard/');   // silent try failed: ask normally
    msg(e === 'access_denied' ? 'Sign-in was cancelled.' : 'Google sign-in failed: ' + e);
  }
  if (q.get('signin')) { history.replaceState(null, '', BASE); const asks = Object.values(EXTRAS).filter(([p]) => q.get(p) === '1'); asks.forEach(x => localStorage.setItem(x[1], '1'));
    return goGoogle(asks.length ? false : q.get('silent') === '1' && !!user(), q.get('ret') || 'dashboard/'); }
  const u = user();
  if (u && tokenOK()) { $('#email').textContent = u.email || u.name || 'your Google account'; show('in'); }
  else if (u) { $('#email').textContent = u.email || ''; show('in'); }     // apps renew the sign-in themselves when opened
  else show('out');
  installTip();
}
function installTip() {
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (standalone) return;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent), android = /Android/.test(navigator.userAgent);
  const t = ios ? 'Tap the <b>Share</b> button (square with an arrow) in Safari, then <b>Add to Home Screen</b>.'
    : android ? 'Tap the <b>⋮</b> menu in Chrome, then <b>Add to Home screen</b> (or <b>Install app</b>).'
    : 'In Chrome or Edge, click the <b>install</b> icon at the right end of the address bar to add RCR Shop as an app.';
  $('#install').innerHTML = '📱 <b>Put RCR Shop on your home screen:</b> ' + t; $('#install').hidden = false;
}
start();
addEventListener('hashchange', () => { if (/access_token|error/.test(location.hash)) start(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
